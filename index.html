    chat.turns.push({ role: 'assistant', content: `${opener.t} (${opener.r}) — ${opener.en}` });
    this.suggest(t.free ? [] : t.steps[0].chips.map(c => ({ t: fill(c.t, { name: P().name }), r: fill(c.r, { name: P().name }), en: fill(c.en, { name: P().name }) })));

  suggest(list) { LS().chat.suggestions = list; renderSuggestions(); },

  /** Learner sends a reply (typed or spoken). */
  async send(text, voice = null) {
    text = String(text || '').trim(); if (!text || this.busy) return;
    const chat = LS().chat;
    if (!chat.topic) this.start(this.topics()[0].id);
    this.push({ who: 'me', text, voice: !!voice });
    if (voice && typeof pronScore === 'function') {
      // Pronunciation check: compare what you said with the closest expected answer.
      const cands = this.topic()?.game ? [Buddy.state().cur].filter(Boolean) : [...(chat.suggestions || [])].filter(s => s && s.t);
      let best = null; cands.forEach(s => { const r = pronScore(s.t, voice); if (!best || r.pct > best.pct) best = { ...r, t: s.t, r: s.r }; });
      if (best) Journal.log({ t: best.t, r: best.r, en: '' }, best.pct);

  },

  /* ---- Offline scripted tutor ---- */
  offline(text, voice) {
    const chat = LS().chat, t = this.topic(), mc = MASCOTS[P().mascot], name = P().name;
    if (!t || t.free) { this.push({ who: 'tutor', mood: 'think', quip: 'Pick a scene above and I’ll play along.' }); return; }
    if (chat.done) { this.push({ who: 'tutor', mood: 'happy', quip: 'That scene is finished! Pick another one above, or replay this one.' }); return; }
    const step = t.steps[chat.step], vars = { name };
    const model = { t: fill(step.model.t, vars), r: fill(step.model.r, vars), en: fill(step.model.en, vars) };
    const chips = step.chips.map(c => ({ t: fill(c.t, vars), r: fill(c.r, vars), en: fill(c.en, vars) }));
    const lines = { right: model.t, rom: model.r };

    if (/^(\?|help|hint|i'?m stuck|i don'?t know|idk|what\??)$/i.test(text)) {
      this.push({ who: 'tutor', mood: 'happy', quip: fill(pick(mc.help), lines), ...model });

    const latin = isLatin(text) && P().lang !== 'es';
    const tests = latin ? step.okRom.map(p => new RegExp(p)).map(re => re.test(romanNorm(text)))
                        : step.ok.map(p => new RegExp(normPattern(p))).map(re => re.test(norm(text)));
    let ok = tests.some(Boolean) || (!latin && chips.some(c => similarity(norm(c.t), norm(text)) >= .75));

    if (ok) {
      const gained = latin ? 3 : 5;
      const quip = latin ? fill(pick(mc.roman), { right: model.t }) : pick(mc.praise);
      P().stats.chatTurns++; if (voice && !latin) P().stats.spoken++; Quests.bump('chat');
      const newWords = step.words.filter(addWord);
      chat.step++;
      const last = chat.step >= t.steps.length;
      const next = fillSay(last ? t.outro : t.steps[chat.step].say);
      this.push({ who: 'tutor', mood: last ? 'cheer' : (latin ? 'giggle' : 'happy'), quip, ...next });
      this.push({ who: 'award', text: `+${gained} XP` });
      newWords.forEach(w => this.push({ who: 'award', word: true, text: `New word: ${w.t} · ${w.en}` }));
      chat.turns.push({ role: 'assistant', content: `${next.t} (${next.r}) — ${next.en}` });
      Sfx.correct(); award(gained);
      if (last) {
        chat.done = true; P().stats.scenes++; (chat.doneScenes ||= {})[t.id] = true; Quests.bump('lesson'); Sfx.complete(); confetti();
        this.push({ who: 'award', text: `Scene complete · +15 XP` }); award(15);
        this.suggest([]); Mascot.set('cheer', 'Scene complete! Pick another one.');
      } else {
        this.suggest(t.steps[chat.step].chips.map(c => ({ t: fill(c.t, vars), r: fill(c.r, vars), en: fill(c.en, vars) })));
        Mascot.set(latin ? 'giggle' : 'happy', quip);
      }
      if (P().autoVoice) Voice.speak(next.t, undefined, undefined, SCENE_NPC[LS().chat.topic]);
    } else {
      const heardPartly = voice && similarity(norm(text), norm(model.t)) > .35;
      const joke = heardPartly ? fill(pick(mc.mishear), { heard: text, right: model.t, rom: model.r })
                               : fill(pick(mc.oops), { you: text, right: model.t });
      const mood = Math.random() < .5 ? 'giggle' : 'shocked';
      addJoke(joke);
      this.push({ who: 'tutor', mood, joke, fix: { you: text, better: model.t, rom: model.r, why: `That doesn’t answer “${step.say.en}”. Try the line above, or tap a suggestion.` } });
      Sfx.wrong(); Mascot.set(mood, joke);
      this.suggest(chips);
    }
    checkAchievements(); Store.save(); renderChrome(); renderChatHead();
  },

  /* ---- AI tutor (Claude or Gemini) ---- */
  rules() {
    const p = P(), c = course(), m = MASCOTS[p.mascot], t = this.topic();
    const known = learnedWords(p, c.code).slice(0, 40).map(w => w.t).join(', ') || 'none yet';
    return `You are ${m.persona}
You are the tutor inside "Speakaboo", a free language app. The learner is ${p.name}, an adult beginner (A0–A1) learning ${c.name}.
Current scene: ${t ? `${t.title} (${t.en})` : 'free chat'}. Words they already know: ${known}.
${t && t.steps ? `This is a LONG role-play. You play the other person in the scene (${SCENE_ROLE[t.id] || 'the other person'}${SCENE_NPC[t.id] ? `, a character named ${MASCOTS[SCENE_NPC[t.id]].name}: ${MASCOTS[SCENE_NPC[t.id]].tagline}` : ''}), while your jokes and corrections still come from you as the tutor. Follow this outline in order, one beat per turn, adapting naturally to what the learner says. Do not wrap up early; the scene ends only after the last beat.
${t.steps.map((s, i) => `${i + 1}. ${fillSay(s.say).en}`).join('\n')}
You are now at beat ${Math.min(LS().chat.step + 1, t.steps.length)} of ${t.steps.length}. When the learner answers this beat sensibly, move to the next beat in your reply.` : 'Free chat: keep the conversation going with a new easy question every turn, drawing on everyday topics (food, family, hobbies, weekend, weather, work).'}

How to tutor:
- Speak mostly in ${c.name}: 1–2 SHORT beginner sentences per turn${({ ko: ' in polite 해요/합니다 style', ar: ' in simple Modern Standard Arabic', es: ' in simple, friendly Spanish (tú unless the scene is formal)' })[c.code]}, ending with one easy question.

- The learner replies by typing (${({ ko: 'Hangul or romanization', ar: 'Arabic script or transliteration', es: 'Spanish, accents optional' })[c.code]}) or by voice (speech-to-text that may mishear).
- Judge their LAST message. "correct": a sensible, grammatical answer (ignore spacing and punctuation). "mistake": wrong grammar, spelling, word choice, meaning, or pronunciation. Romanization is allowed but gently nudge toward script. "none": they asked for help or wrote in English.
- On a mistake: first one short witty joke about the mistake, in character (max 25 words, affectionate, PG, never about intelligence or looks). Then the corrected sentence and one plain-English line explaining why.
- If the input was spoken and looks misheard, set "misheard" to a playful English rendering of how it sounded (e.g. "gamsa-hamster-nida?") and coach the correct sound in "why".
- If they ask for help or write English, answer kindly and give a sentence to try.
- At most one new word per turn in new_words. Stay beginner-level.

Reply with ONLY one JSON object, no other text:
{"mood":"happy|giggle|shocked|cheer","verdict":"correct|mistake|none","quip":"short in-character English reaction","joke":"only on mistakes, else empty","misheard":"","correction":{"better":"","better_rom":"","why":""},"reply":{"text":"","rom":"","en":""},"suggestions":[{"text":"","rom":"","en":""}],"new_words":[{"t":"","r":"","en":""}]}
"suggestions": 2–3 short possible answers to YOUR new question, in ${c.name} script.`;
  },

  async ai(text, voice) {
    const chat = LS().chat, rules = this.rules();

  async askClaude(rules, turns) {

  },

  async askGemini(rules, turns) {
    const ai = Store.data.ai;
    const contents = [{ role: 'user', parts: [{ text: '[session start]' }] }, ...turns.map(t => ({ role: t.role === 'assistant' ? 'model' : 'user', parts: [{ text: t.content }] }))];
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(ai.geminiModel || 'gemini-2.5-flash')}:generateContent`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': ai.geminiKey },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: rules }] }, contents, generationConfig: { temperature: .9, responseMimeType: 'application/json' } })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const raw = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';

    return JSON.parse(raw.slice(s, e + 1));
  },

  /** Turn a model reply into chat messages, XP, jokes and words. */
  handle(res, text, voice) {
    const chat = LS().chat, p = P();
    const str = v => (typeof v === 'string' ? v : '').slice(0, 400);
    const reply = res && typeof res.reply === 'object' ? res.reply : {};
    const moods = ['happy', 'giggle', 'shocked', 'cheer'];
    let mood = moods.includes(res?.mood) ? res.mood : 'happy';
    const verdict = res?.verdict;
    const msg = { who: 'tutor', mood, quip: str(res?.quip), t: str(reply.text), r: str(reply.rom), en: str(reply.en) };
    if (verdict === 'mistake') {
      msg.joke = str(res.joke); msg.misheard = str(res.misheard);
      const c = res.correction || {};
      if (c.better) msg.fix = { you: text, better: str(c.better), rom: str(c.better_rom), why: str(c.why) };
      if (msg.joke) addJoke(msg.joke);
      if (mood === 'happy') mood = msg.mood = 'giggle';
    }
    this.push(msg);
    chat.turns.push({ role: 'assistant', content: JSON.stringify(res).slice(0, 1500) });
    const tp = this.topic();

/* =====================================================================
   SPEAKABOO — ACCOUNTS, FREE TRIAL & GOOGLE PLAY SUBSCRIPTION
   · Email + password accounts (Firebase Auth). Progress is saved to the

   · 7-day free trial from sign-up, then a monthly or yearly subscription
     bought through Google Play Billing (Digital Goods API + Payment
     Request, available when the app runs from the Play Store).
   · The trial start and the paid-until date live on the server and can
     only be written by Firebase (see backend/firestore.rules), so they

  user: null, meta: {}, db: null, pushT: null, ready: false,

  loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.append(s); }); },

  /** Called by boot(). start() opens the normal app once we know who you are. */

/* ---------- Who gets in: trial, subscriber, or paywall ---------- */

/* ---------- What the free trial includes (edit in config.js → trial) ---------- */

  season: `The free trial covers Season ${TRIAL.seasons === 1 ? '1' : '1–' + TRIAL.seasons}. Go Premium to unlock every season.`,
  talk: `That’s ${TRIAL.talkPerDay} Talk rounds today, the free-trial limit. Premium talks all day.`,
  call: 'Call Boo is a Premium feature: hands-free voice practice, as long as you like.',
  drill: 'This drill is part of Premium. The trial includes the basic drills.',
  skip: 'Skipping ahead to later seasons is part of Premium.'

  const p = P(), t = dayKey();

/* ---------- Google Play Billing (inside the Play Store app) ---------- */
const PLAY = 'https://play.google.com/billing';
const Billing = {
  svc: null, prices: {},
  async service() {
    if (this.svc) return this.svc;
    if (!('getDigitalGoodsService' in window)) return null;
    try { this.svc = await window.getDigitalGoodsService(PLAY); } catch (e) { this.svc = null; }
    return this.svc;
  },
  available() { return 'getDigitalGoodsService' in window; },
  async loadPrices() {
    const s = await this.service(); if (!s) return {};
    try {
      const items = await s.getDetails((CFG.products || []).map(p => p.id));
      for (const it of items) {
        const pr = it.price || {};
        let label = pr.value; try { label = new Intl.NumberFormat(undefined, { style: 'currency', currency: pr.currency }).format(pr.value); } catch (e) { /* raw */ }
        this.prices[it.itemId] = { label, value: +pr.value, currency: pr.currency, title: it.title };
      }
    } catch (e) { /* show without prices */ }
    return this.prices;
  },
  async buy(sku) {
    const s = await this.service();
    if (!s) { toast('Subscriptions work in the Speakaboo app from Google Play.'); return false; }
    const req = new PaymentRequest([{ supportedMethods: PLAY, data: { sku } }], { total: { label: 'Total', amount: { currency: 'USD', value: '0' } } });
    let res;
    try { res = await req.show(); } catch (e) { return false; }   // cancelled
    const token = (res.details && (res.details.purchaseToken || res.details.token)) || '';
    try { await this.verify(token, sku); await res.complete('success'); return true; }
    catch (e) { await res.complete('fail').catch(() => {}); toast('Payment received but not confirmed yet. Tap “Restore purchase” in a minute.'); return false; }
  },
  /** Ask our server to check the purchase with Google and unlock Premium. */
  async verify(token, sku) {
    if (!token) throw new Error('no token');
    const fn = firebase.functions().httpsCallable('verifyPurchase');
    const r = await fn({ token, sku });
    Account.meta.premiumUntil = r.data.premiumUntil || 0;
    Access.check();
    return r.data;
  },
  async restore(quiet) {
    const s = await this.service();
    if (!s) { if (!quiet) toast('Open Speakaboo from Google Play to restore a subscription.'); return; }
    try {
      const list = await s.listPurchases(); let ok = false;
      for (const p of list) { try { const r = await this.verify(p.purchaseToken, p.itemId); if (r.premiumUntil > Date.now()) ok = true; } catch (e) { /* next */ } }

  /** On every start: keep the paid-until date fresh (renewals, cancellations). */
  async refresh() { await Account.refreshMeta(); if (this.available()) await this.restore(true); Access.check(); }

const React = {
  right: ['cheer', 'proud', 'laugh', 'love', 'star'],
  pick(ok, combo, wrongRun) {
    if (ok) {
      if (combo >= 8) return 'love';

      if (combo >= 3) return pick(['star', 'cheer', 'laugh']);
      return pick(['cheer', 'proud', 'laugh']);
    }

    if (wrongRun === 2) return pick(['cry', 'pout']);
    return pick(['shocked', 'oops', 'pout']);
  },
  headline(ok, combo, wrongRun) {
    if (ok) return combo >= 8 ? 'Unstoppable!' : combo >= 5 ? `${combo} in a row!` : combo >= 3 ? 'On fire!' : pick(['Nice!', 'Correct!', 'You got it!', 'Boo-tiful!', 'Yes!']);

      stars: () => `<svg viewBox="0 0 20 20"><path d="M10 1l2.7 5.6 6.1.8-4.5 4.2 1.2 6L10 14.7 4.5 17.6l1.2-6L1.2 7.4l6.1-.8z" fill="${pick(['#FFC23D', '#FFE066', '#B6A3FF', '#5FDDB0'])}"/></svg>`,
      tears: () => `<svg viewBox="0 0 20 20"><path d="M10 2c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12z" fill="#7CC8FF" stroke="#3C8FD6" stroke-width="1"/></svg>`,
      clouds: () => `<svg viewBox="0 0 24 20"><path d="M6 15a5 5 0 0 1 1-9 6 6 0 0 1 11 1 4 4 0 0 1 0 8z" fill="#C9C2D6"/><path d="M11 15l-2 4M15 15l-2 4" stroke="#7CC8FF" stroke-width="1.8" stroke-linecap="round"/></svg>`

function pronScore(target, alts) {

    el.innerHTML = `<p class="q">${step.retry ? '<span class="badge-new" style="margin-right:8px">Previous mistake</span>' : ''}Which picture is this?</p>
      <div class="prompt"><button class="speaker" data-say="${esc(w.t)}" aria-label="Play">${ICON.speaker}</button><div><div class="prompt-text script" ${attrs(c)} style="font-size:34px">${esc(w.t)}</div><div class="prompt-sub" style="width:auto">${esc(w.r)}</div></div></div>
      <div class="pic-grid">${step.options.map((o, i) => `<button class="pic-card" data-i="${i}"><span class="pic">${artSVG(o.pic)}</span><small class="pic-label">${esc(o.en)}</small></button>`).join('')}</div>`;
    const answer = i => {
      if (R.locked) return; const ok = step.options[i].t === w.t;
      $$('.pic-card', el).forEach((b, j) => { b.classList.add('revealed'); if (step.options[j].t === w.t) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
      R.grade(ok, { you: step.options[i].en, show: ok ? null : { t: w.t, r: w.r, en: w.en }, teach: `${w.t} (${w.r}) = ${w.en}` });
    };
    $$('.pic-card', el).forEach(b => b.onclick = () => answer(+b.dataset.i));
    addPeek(el, R, '.pic-card', j => step.options[j].t !== step.w.t);

    setTimeout(() => Voice.speak(w.t), 250);
  },
  dialog(step, el, R) {
    const c = course(), s = step.say;
    el.innerHTML = `<p class="q">Reply to ${esc(MASCOTS[step.npc].name)}</p>`;
    bubblePrompt(el, `<button class="speaker sm" data-say="${esc(s.t)}" data-who="${step.npc}" aria-label="Play">${ICON.speaker}</button><span><span class="script" ${attrs(c)} style="font-size:21px">${esc(s.t)}</span><small class="bubble-rom">${esc(s.r)}</small><small class="bubble-en">${esc(s.en)}</small></span>`, step.npc);
    el.insertAdjacentHTML('beforeend', `<div class="opts one">${step.options.map((o, i) => `<button class="opt script" ${attrs(c)} data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o.t)}<small class="opt-rom">${esc(o.r)}</small></span></button>`).join('')}</div>`);
    const answer = i => {
      if (R.locked) return; const ok = step.options[i].t === step.reply.t;
      $$('.opt', el).forEach((b, j) => { if (step.options[j].t === step.reply.t) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
      Voice.speak(step.reply.t);
      R.grade(ok, { you: step.options[i].t, show: { t: step.reply.t, r: step.reply.r, en: step.reply.en } });
    };
    $$('.opt', el).forEach(b => b.onclick = () => answer(+b.dataset.i));
    R.select = answer;
    setTimeout(() => Voice.speak(s.t, c.tts, .9, step.npc), 250);
  },
  match(step, el, R) {
    const c = course(), left = shuffle(step.pairs), right = shuffle(step.pairs);
    el.innerHTML = `<p class="q">Tap the matching pairs</p>
      <div class="match"><div class="col">${left.map(x => `<button class="tile ${step.aScript ? 'script' : ''}" ${attrs(c)} draggable="true" data-side="a" data-k="${esc(x.k)}">${esc(x.a)}</button>`).join('')}</div>
      <div class="col">${right.map(x => `<button class="tile" data-side="b" data-k="${esc(x.k)}">${esc(x.b)}</button>`).join('')}</div></div>`;
    let selA = null, selB = null, left_ = step.pairs.length, mistakes = 0;
    const attempt = (a, b) => {
      if (a.dataset.k === b.dataset.k) {
        a.classList.remove('sel'); b.classList.remove('sel'); a.classList.add('ok'); b.classList.add('ok'); a.disabled = b.disabled = true;
        Sfx.pop(); Voice.speak(step.pairs.find(x => x.k === a.dataset.k).say);
        if (--left_ === 0) setTimeout(() => R.grade(mistakes === 0, { weight: 1, correctCount: mistakes ? 0 : 1, teach: mistakes ? `${mistakes} mix-up${mistakes > 1 ? 's' : ''} on the way.` : 'Perfect matching!' }), 350);
      } else { mistakes++; Sfx.wrong(); [a, b].forEach(t => { t.classList.remove('sel'); t.classList.add('bad'); setTimeout(() => t.classList.remove('bad'), 400); }); }
      selA = selB = null;
    };
    $$('.tile', el).forEach(t => {
      t.onclick = () => {
        if (t.dataset.side === 'a') { selA = selA === t ? null : t; $$('[data-side="a"]', el).forEach(x => x.classList.toggle('sel', x === selA)); Voice.speak(step.pairs.find(x => x.k === t.dataset.k).say); }
        else { selB = selB === t ? null : t; $$('[data-side="b"]', el).forEach(x => x.classList.toggle('sel', x === selB)); Sfx.tap(); }
        if (selA && selB) attempt(selA, selB);
      };
      if (t.dataset.side === 'a') t.ondragstart = e => { e.dataTransfer.setData('text/plain', t.dataset.k); selA = t; };
      else { t.ondragover = e => { e.preventDefault(); t.classList.add('over'); }; t.ondragleave = () => t.classList.remove('over');
        t.ondrop = e => { e.preventDefault(); t.classList.remove('over'); const a = $$('[data-side="a"]', el).find(x => x.dataset.k === e.dataTransfer.getData('text/plain')); if (a && !a.disabled) attempt(a, t); }; }
    });
  },
  build(step, el, R) {
    const target = step.ch, rows = [['Consonant', 'i', step.poolC, HG.I], ['Vowel', 'm', step.poolV, HG.M]];
    if (step.finals) rows.push(['Bottom (batchim)', 'f', ['', 'ㄱ', 'ㄴ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅇ', 'ㅅ'], HG.F]);
    const pickOpts = (right, pool, all) => { const others = shuffle([...new Set([...pool, ...all])].filter(x => x !== right && all.includes(x))); return shuffle([right, ...others.slice(0, 3)]); };
    const sel = { i: null, m: null, f: step.finals ? null : '' };
    el.innerHTML = `<p class="q">Build the syllable you hear</p>
      <div class="prompt"><button class="speaker big" data-say="${esc(target)}" aria-label="Play">${ICON.speaker}</button><div class="prompt-text latin">“${esc(HG.rom(step.i, step.m, step.f))}”</div></div>
      <div class="builder"><div class="block-preview script" lang="ko" id="bp"></div>
      ${rows.map(([label, k, pool, all]) => `<div class="b-row"><span class="eyebrow">${label}</span><div class="chips">${pickOpts(step[k], pool, all).map(o => `<button class="wt script" lang="ko" data-k="${k}" data-v="${esc(o)}">${o || '—'}</button>`).join('')}</div></div>`).join('')}</div>`;
    const draw = () => {
      const ch = sel.i && sel.m ? HG.compose(sel.i, sel.m, sel.f || '') : (sel.i || '') + (sel.m || '');
      $('#bp', el).textContent = ch; $('#bp', el).classList.toggle('ok', !!(sel.i && sel.m));
      if (sel.i && sel.m && sel.f !== null) setTimeout(() => {
        const made = HG.compose(sel.i, sel.m, sel.f || ''), ok = made === target;
        R.grade(ok, { you: made, show: { t: target, r: HG.rom(step.i, step.m, step.f), en: `${step.i} + ${step.m}${step.f ? ' + ' + step.f : ''}` } });
      }, 350);
    };
    $$('.wt', el).forEach(b => b.onclick = () => {
      if (R.locked) return; const k = b.dataset.k; sel[k] = b.dataset.v;
      $$(`.wt[data-k="${k}"]`, el).forEach(x => x.classList.toggle('sel', x === b)); Sfx.tap();
      if (sel.i && sel.m) Voice.speak(HG.compose(sel.i, sel.m, sel.f || ''));
      draw();
    });
    draw(); setTimeout(() => Voice.speak(target), 250);
  },
  tiles(step, el, R) {
    const c = course(), s = step.s, toEn = step.dir === 'en', who = step.who;
    const answer = toEn ? enTokens(s.en) : koTokens(s.t);
    const pool = toEn ? allSentences().flatMap(x => enTokens(x.en)) : allSentences().flatMap(x => koTokens(x.t));
    const lowerAns = answer.map(w => w.toLowerCase());
    const extras = shuffle([...new Set(pool)].filter(w => !lowerAns.includes(w.toLowerCase()))).slice(0, Math.min(4, Math.max(2, 7 - answer.length)));
    const bank = shuffle([...answer, ...extras]).map((w, i) => ({ w, i }));
    const title = step.listen ? 'Tap what you hear' : toEn ? 'Translate this sentence' : 'Write this in ' + c.name;
    el.innerHTML = `<p class="q">${step.retry ? '<span class="badge-new" style="margin-right:8px">Previous mistake</span>' : ''}${title}</p>`;
    if (step.listen) bubblePrompt(el, `<button class="speaker big" data-say="${esc(s.t)}" data-who="${who}" aria-label="Play">${ICON.speaker}</button><button class="speaker slow" data-say="${esc(s.t)}" data-who="${who}" data-rate=".55" aria-label="Play slowly">${ICON.turtle}</button>`, who);
    else if (toEn) bubblePrompt(el, `<button class="speaker sm" data-say="${esc(s.t)}" data-who="${who}" aria-label="Play">${ICON.speaker}</button><span class="script" ${attrs(c)}>${koTokens(s.t).map(tok => `<button class="hw" data-say="${esc(tok)}" title="${esc(hintFor(tok))}">${esc(tok)}</button>`).join('')}</span><small class="bubble-rom">${esc(s.r)}</small>`, who);
    else bubblePrompt(el, `<span style="font-size:19px;font-weight:700">${esc(s.en)}</span>`, who);
    el.insertAdjacentHTML('beforeend', `<div class="answer-line" id="ans"></div><p class="note tiles-note">Tap words in order. It checks itself when the sentence is full.</p><div class="bank" id="bank">${bank.map(b => `<button class="wt ${toEn ? '' : 'script'}" ${toEn ? '' : attrs(c)} data-b="${b.i}">${esc(b.w)}</button>`).join('')}</div>`);
    const chosen = [], ans = $('#ans', el);
    const submit = () => {
      const words = chosen.map(i => bank.find(b => b.i === i).w);
      const ok = toEn ? [s.en, ...(s.alt || [])].map(normEn).includes(normEn(words.join(' '))) : norm(words.join('')) === norm(s.t);
      if (!toEn || ok) Voice.speak(s.t, c.tts, .9, who);
      ans.classList.add(ok ? 'good' : 'bad');
      R.grade(ok, { you: words.join(' '), show: toEn ? (ok ? null : s.en) : { t: s.t, r: s.r, en: s.en }, teach: ok && toEn ? `${s.t} (${s.r})` : '' });
    };
    const redraw = () => {
      ans.innerHTML = chosen.map(i => `<button class="wt ${toEn ? '' : 'script'}" ${toEn ? '' : attrs(c)} data-a="${i}">${esc(bank.find(b => b.i === i).w)}</button>`).join('');
      $$('[data-b]', el).forEach(b => b.classList.toggle('ghost', chosen.includes(+b.dataset.b)));
      if (chosen.length === answer.length) setTimeout(() => { if (!R.locked && chosen.length === answer.length) submit(); }, 450);
    };
    el.addEventListener('click', e => {
      if (R.locked) return;
      const b = e.target.closest('[data-b]'), a = e.target.closest('[data-a]');
      if (b) { chosen.push(+b.dataset.b); Sfx.tap(); if (!toEn) Voice.speak(bank.find(x => x.i === +b.dataset.b).w); redraw(); }
      else if (a) { chosen.splice(chosen.indexOf(+a.dataset.a), 1); redraw(); }
      const hw = e.target.closest('.hw'); if (hw) toast(hw.title);
    });
    if (step.listen || toEn) setTimeout(() => Voice.speak(s.t, c.tts, .9, who), 300);
  },
  blank(step, el, R) {
    const c = course(), b = step.b, [pre, post] = b.t.split('__');
    el.innerHTML = `<p class="q">${step.retry ? '<span class="badge-new" style="margin-right:8px">Previous mistake</span>' : ''}Fill in the blank</p><p class="muted" style="margin:-10px 0 0;font-weight:700">${esc(b.en)}</p>
      <div class="blank-sent script" ${attrs(c)}>${esc(pre)}<span class="gap" id="gap">&nbsp;</span>${esc(post || '')}</div>
      <div class="chips">${shuffle(b.options).map(o => `<button class="wt script" ${attrs(c)} data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    const answer = x => {
      if (R.locked || !x) return; const sel = x.dataset.o;
      $$('[data-o]', el).forEach(y => y.classList.toggle('sel', y === x)); const g = $('#gap', el); g.textContent = sel; g.classList.add('filled');
      const ok = sel === b.answer, full = b.t.replace('__', b.answer);
      g.classList.add(ok ? 'good' : 'bad');
      if (/[가-힣ا-ي]/.test(full) && !/^\d/.test(full)) Voice.speak(full.replace(/→.*/, '').replace(/=.*/, ''));
      R.grade(ok, { you: sel, show: { t: full, en: b.en }, why: b.why });
    };
    $$('[data-o]', el).forEach(x => x.onclick = () => answer(x));
    R.select = i => answer($$('[data-o]', el)[i]);
  },
  speak(step, el, R) {
    const c = course(), it = step.item, who = step.who || P().mascot, mc = MASCOTS[P().mascot];
    const canMic = !!Mic.SR && !Mic.blocked;
    el.innerHTML = `<p class="q">${it.pic ? 'Say this word' : 'Speak this sentence'}</p>`;
    bubblePrompt(el, `<button class="speaker sm" data-say="${esc(it.t)}" data-who="${who}" aria-label="Play">${ICON.speaker}</button><button class="speaker sm slow" data-say="${esc(it.t)}" data-who="${who}" data-rate=".55" aria-label="Play slowly">${ICON.turtle}</button><span>${esc(MASCOTS[who].name)}: “Repeat after me!”</span>`, who);
    el.insertAdjacentHTML('beforeend', `<div class="speak-card">${it.pic ? `<div class="pic-hero sm" aria-hidden="true">${artSVG(it.pic)}</div>` : ''}
        <div class="speak-target script" id="sp-t" ${attrs(c)}>${esc(it.t)}</div><div class="speak-rom">${esc(it.r)}</div><div class="speak-en">${esc(it.en)}</div>${starBtn(it)}${echoHTML()}</div>
      ${canMic ? `<div class="mic-row"><button class="mic-big" id="sp-mic" aria-label="Tap to speak">${ICON.mic}</button>
          <div class="mic-status" id="sp-st"><span>${P().micReady ? 'Listen… then speak when the mic glows.' : 'Tap the mic and repeat. Your browser asks for the microphone once.'}</span><div class="meter" style="margin-top:8px"><i id="sp-meter" style="width:0"></i></div></div></div>`
        : `<div class="fallback">${IN_ARTIFACT ? `The microphone is blocked inside claude.ai.${APP_URL ? ` Open the app at <b style="user-select:all">${esc(APP_URL)}</b> to be checked by voice.` : ''}` : 'This browser has no speech recognition. Chrome (Android, desktop) and Safari (iPhone) support it.'} Say it out loud, then rate yourself.
          <div class="row"><button class="btn good sm" id="sp-self-ok">I said it well</button><button class="btn ghost sm" id="sp-self-no">Needs practice</button></div></div>`}`);
    R.skipAllowed('Can’t speak now'); wireEcho(el, it.t, who);
    if (!canMic) { setTimeout(() => Voice.speak(it.t, c.tts, .9, who), 250); $('#sp-self-ok', el).onclick = () => R.grade(true, { teach: 'Honor system accepted.' }); $('#sp-self-no', el).onclick = () => R.grade(true, { teach: 'Replay the slow version a few times.' }); return; }
    let tries = 0, alive = true;
    const listen = async () => {
      const btn = $('#sp-mic', el), st = $('#sp-st span', el); if (!btn || R.locked) return;
      if (Mic.active) { Mic.stop(); return; }
      btn.classList.add('on'); st.textContent = 'Listening… speak now.';
      try {
        const alts = await listenOnce(c.stt); btn.classList.remove('on'); tries++;
        const r = pronScore(it.t, alts); Journal.log(it, r.pct);
        $('#sp-t', el).innerHTML = r.html;
        const meter = $('#sp-meter', el); meter.style.width = r.pct + '%'; meter.style.background = r.ok ? 'var(--jade)' : 'var(--coral)';
        if (r.ok) { P().stats.spoken++; Quests.bump('speak'); R.grade(true, { teach: `${r.pct}% match. I heard “${r.best}”.` }); }
        else if (tries >= 3) R.grade(true, { teach: `${r.pct}% after 3 tries. Red syllables need practice. No heart lost for pronunciation.`, noAuto: true });
        else { st.textContent = `${fill(pick(mc.mishear), { heard: r.best, right: it.t, rom: it.r })} (${r.pct}% · try ${tries}/3) Tap the mic to try again.`; Sfx.wrong(); }
      } catch (code) { btn.classList.remove('on'); st.textContent = Mic.explain(code); if (Mic.blocked) { alive = false; RENDER.speak(step, el, R); } }
    };
    $('#sp-mic', el).onclick = listen;
    // Play the model line; once it finishes, start listening automatically (after the first permission).
    setTimeout(() => Voice.speakThen(it.t, c.tts, .9, who).then(() => { if (alive && P().micReady && !R.locked && $('#sp-mic', el)) listen(); }), 250);
  }
};

function renderChat() {
  const c = course(), p = P();
  $('#tab-chat').innerHTML = `<div class="chat">
    <div class="chat-head"><div class="topics" id="topics"></div>
      <button class="brain" id="brain"></button>
      <button class="topic" id="en-toggle" aria-pressed="${p.showEnglish}" title="Show English translations">EN</button></div>
    <div class="chat-log" id="chat-log"></div>
    <div class="suggest" id="suggest"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="sr" for="chat-input">Your reply</label>
      <input class="input script" id="chat-input" lang="${c.code}" dir="auto" placeholder="Reply in ${c.name}…" enterkeyhint="send">
      <button type="button" class="round mic" id="mic" aria-label="Answer by voice">${ICON.mic}</button>
      <button type="submit" class="round send" id="send" aria-label="Send">${ICON.send}</button>
    </form>
    <div class="chat-note">${esc(c.typingTip)}</div>
  </div>`;
  renderChatHead();
  const log = $('#chat-log');
  log.innerHTML = LS().chat.log.map(m => msgHTML(m, false)).join('');
  $$('.mascot[data-msg-art]', log).forEach(el => paintMascot(el, el.dataset.msgWho || P().mascot, el.dataset.msgArt, false));
  log.scrollTop = log.scrollHeight;
  renderSuggestions();
  $('#composer').onsubmit = e => { e.preventDefault(); const i = $('#chat-input'); const v = i.value; i.value = ''; Tutor.send(v); };
  $('#mic').onclick = chatMic;
  $('#en-toggle').onclick = () => { p.showEnglish = !p.showEnglish; Store.save(); renderChat(); };
  $('#brain').onclick = () => { showTab('profile'); setTimeout(() => $('#ai-panel')?.scrollIntoView({ behavior: 'smooth' }), 50); };
  if (Tutor.busy) showTyping(true);
  if (!LS().chat.log.length) { Tutor.start(Tutor.topics()[0].id); renderChatHead(); }
}
function renderChatHead() {
  const t = $('#topics'); if (!t) return;
  const chat = LS().chat, cur = Tutor.topic(), n = cur?.steps?.length || 0;
  const g = chat.game || {};
  const turn = cur?.game ? `Streak ${g.streak || 0} · best ${g.best || 0}` : cur && !cur.free ? (chat.done ? 'Done' : `Turn ${Math.min(chat.step + 1, n)} of ${n}`) : cur ? 'Open-ended' : '';
  t.innerHTML = `<button class="scene-btn" data-scenes aria-label="Choose a scene">${ICON.chat}<span><b>${esc(cur ? cur.title : 'Pick a scene')}</b><small>${esc(turn)}</small></span><span class="chev">Change</span></button>
    ${cur?.game ? `<div class="game-tools"><button class="chip-btn call-chip" data-call>☎ Call ${esc(MASCOTS[P().mascot].name)}</button><button class="chip-btn" data-buddy-skip>Skip</button><button class="chip-btn ${P().handsFree ? 'on' : ''}" data-hands-free aria-pressed="${!!P().handsFree}" title="Prompts are read aloud and the mic opens by itself">${ICON.mic} Hands-free ${P().handsFree ? 'on' : 'off'}</button></div>` : ''}

}

function msgHTML(m, animate) {
  const c = course(), p = P();
  if (m.who === 'divider') return `<div class="award" style="background:var(--surface-2);color:var(--ink-2)">Scene · ${esc(m.text)}</div>`;
  if (m.who === 'award') return `<div class="award ${m.word ? 'word' : ''}">${esc(m.text)}</div>`;
  if (m.who === 'pron') return `<div class="msg me"><div class="pron">Pronunciation <b class="${m.ok ? 'good' : 'bad'}">${m.pct}%</b> · <span class="script" lang="${c.code}">${m.html}</span>${m.ok ? '' : `<small class="bubble-rom">Red parts need work${m.rom ? `: say “${esc(m.rom)}”` : ''}. Tap a suggestion to hear it.</small>`}</div></div>`;
  if (m.who === 'tutor' && m.npc && m.quip && m.t && !m.joke) return msgHTML({ who: 'tutor', mood: m.mood, quip: m.quip }, animate) + msgHTML({ ...m, quip: '' }, animate);
  if (m.who === 'me') return `<div class="msg me"><div class="bub">${m.voice ? '<small>Said aloud</small>' : ''}<span class="script" lang="${c.code}" dir="auto">${esc(m.text)}</span></div></div>`;
  return `<div class="msg tutor"><div class="mascot ${animate ? 'm-' + (m.mood || 'happy') : ''}" data-msg-art="${m.npc && !m.joke ? 'happy' : (m.mood || 'happy')}" data-msg-who="${m.npc && !m.joke ? m.npc : ''}"></div><div class="bub">${m.npc && !m.joke ? `<span class="npc-name">${esc(MASCOTS[m.npc].name)} · ${esc(SCENE_ROLE[LS().chat.topic] || '')}</span>` : ''}

async function chatMic() {
  const btn = $('#mic');
  if (Mic.active) { Mic.stop(); return; }
  if (!Mic.supported()) { toast(Mic.explain(Mic.SR ? 'not-allowed' : 'unsupported')); return; }
  btn.classList.add('on'); Mascot.set('think', 'Listening… speak now!');
  try {

    btn.classList.remove('on'); Tutor.send(alts[0], alts);

    <button class="btn gold" data-buy="freeze" ${p.gems >= 100 && p.freezes < 2 ? '' : 'disabled'}>Buy a freeze · 100 gems</button>`);
}
function langSheet() {
  openSheet(`<div class="sheet-head"><h2>My courses</h2><button class="icon-btn" data-close aria-label="Close">${ICON.x}</button></div>
    ${Object.values(COURSES).map(c => `<button class="lang-opt" data-lang="${c.code}" aria-pressed="${P().lang === c.code}"><span class="flag script" ${attrs(c)} style="font-family:${c.font}">${c.flag}</span><span>${c.name} <span class="script" ${attrs(c)} style="font-family:${c.font};font-weight:600">${c.native}</span><small>${c.level} · ${c.units.length} units + letters${c.status === 'preview' ? ' · preview' : ''}</small></span></button>`).join('')}`);
}
async function installApp() {
  if (installPrompt) { installPrompt.prompt(); const r = await installPrompt.userChoice.catch(() => null); installPrompt = null; if (r?.outcome === 'accepted') toast('Installed! Open Speakaboo from your home screen.'); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openSheet(`<div class="sheet-head"><h2>Install Speakaboo</h2><button class="icon-btn" data-close aria-label="Close">${ICON.x}</button></div>
    ${IN_ARTIFACT ? `<p>Apps can’t be installed from inside claude.ai.${APP_URL ? ` Open <b style="user-select:all">${esc(APP_URL)}</b> in your phone’s browser first, then follow the steps below.` : ''}</p>` : ''}
    <div class="guide-card"><h3>iPhone / iPad (Safari)</h3><p>Tap the Share button, then “Add to Home Screen”, then “Add”.</p></div>
    <div class="guide-card"><h3>Android (Chrome)</h3><p>Tap the ⋮ menu, then “Install app” or “Add to Home screen”.</p></div>
    <div class="guide-card"><h3>Computer (Chrome / Edge)</h3><p>Click the install icon at the right end of the address bar.</p></div>
    ${ios ? '' : '<p class="note">The first time you answer by voice, allow the microphone when the browser asks.</p>'}`);
}

/* =====================================================================
   GLOBAL WIRING & BOOT
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-buddy-skip]')) { Buddy.skip(); return; }
  if (t.closest('[data-hands-free]')) { P().handsFree = !P().handsFree; Store.save(); renderChatHead(); toast(P().handsFree ? 'Hands-free on: I read prompts aloud and open the mic for you.' : 'Hands-free off.'); if (P().handsFree && !P().autoVoice) { P().autoVoice = true; Store.save(); } return; }
  const hb = t.closest('[data-hero-boo]'); if (hb) { heroPeek(hb); return; }
  if (t.closest('[data-call]')) { Call.open(); return; }
  const hide = t.closest('[data-hide]'); if (hide) { hideTap(+hide.dataset.hide); return; }
  const dans = t.closest('[data-daily-ans]'); if (dans) { dailyAnswer(dans.dataset.dailyAns); return; }
  const wear = t.closest('[data-wear]'); if (wear) { P().wear = wear.dataset.wear || null; Store.save(); renderChrome(); renderProfile(); Mascot.set('cheer', 'How do I look?'); return; }
  const feel = t.closest('[data-feel]'); if (feel) { startMood(feel.dataset.feel); return; }
  const star = t.closest('[data-star]'); if (star) { const on = Phrases.toggle(JSON.parse(star.dataset.star)); star.classList.toggle('on', on); if (UI.tab === 'practice' && $('#lesson').hidden) renderPractice(); return; }
  const stamp = t.closest('[data-stamp]'); if (stamp) { cultureSheet(stamp.dataset.stamp); return; }
  const say = t.closest('[data-say]'); if (say) { Voice.speak(say.dataset.say, say.dataset.tts || course().tts, say.dataset.rate ? +say.dataset.rate : .9, say.dataset.who || null); if (!say.closest('.hw')) return; }
  const node = t.closest('[data-node]'); if (node) { showNodePop(node.dataset.node); Sfx.tap(); return; }
  const go = t.closest('[data-go]'); if (go) { const [uid, i, mode] = go.dataset.go.split(':'); startLesson(uid, +i, mode); return; }
  const tab = t.closest('[data-tab]'); if (tab) { showTab(tab.dataset.tab); return; }
  const lang = t.closest('[data-lang]'); if (lang) { setLang(lang.dataset.lang); return; }
  const sh = t.closest('[data-sheet]'); if (sh) { ({ streak: streakSheet, gems: () => { showTab('quests'); }, hearts: () => heartsSheet(false), lang: langSheet })[sh.dataset.sheet](); return; }
  const g = t.closest('[data-guide]'); if (g) { openGuide(g.dataset.guide); return; }
  if (t.closest('[data-scenes]')) { scenesSheet(); return; }
  const tp = t.closest('[data-topic]'); if (tp) { if (!Tutor.busy) { closeSheet(); Tutor.start(tp.dataset.topic); renderChatHead(); } return; }
  const sk = t.closest('[data-skip-section]'); if (sk) { skipSectionSheet(+sk.dataset.skipSection); return; }
  const sn = t.closest('[data-skip-now]'); if (sn) { skipSection(+sn.dataset.skipNow); return; }
  const stest = t.closest('[data-skip-test]'); if (stest) { closeSheet(); placementTest(+stest.dataset.skipTest); return; }
  const pr = t.closest('[data-practice]'); if (pr) { closeSheet(); startPractice(pr.dataset.practice); return; }
  const b = t.closest('[data-buy]'); if (b) { buy(b.dataset.buy); return; }
  if (t.closest('[data-install]')) { installApp(); return; }
  if (t.closest('[data-hide-install]')) { P().hideInstall = true; Store.save(); renderLearn(); return; }
  if (t.closest('[data-switch]')) { showProfiles(); return; }
  if (t.closest('[data-mascot-live]') && P()) { Mascot.set(pick(['giggle', 'cheer', 'happy']), pick(MASCOTS[P().mascot].praise)); Sfx.pop(); return; }
  if (!t.closest('.pop-card')) $$('.pop-card').forEach(x => x.remove());
});
$('#l-main').onclick = () => Runner.main();
$('#l-close').onclick = () => Runner.askQuit();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) return closeSheet();
  if ($('#lesson').hidden || !$('#modal').hidden) return;
  if (e.key === 'Enter' && !$('#l-main').disabled && !e.target.closest('input')) { e.preventDefault(); Runner.main(); }
  else if (/^[1-9]$/.test(e.key) && Runner.select && !Runner.locked) Runner.select(+e.key - 1);
  else if (e.key === 'Escape') Runner.askQuit();
});
setInterval(() => { if (P() && !$('#app').hidden && $('#lesson').hidden) { const before = P().hearts; Hearts.sync(); if (P().hearts !== before) { Store.save(); renderChrome(); } } }, 60000);

/* Reopening the app always lands on the Learn home (like a fresh start), not wherever you left off. */
function goHome() {
  if (!P() || $('#app').hidden) return;
  closeSheet(); $('#modal').hidden = true;
  if (!$('#lesson').hidden) Runner.close();
  UI.tab = 'learn'; BooMood.apply(); renderChrome(); showTab('learn'); setTimeout(welcomeBack, 700);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 90 * 1000) goHome();
});
addEventListener('pageshow', e => { if (e.persisted) goHome(); });

(function boot() {
  Store.load(); Voice.init();
  Account.boot(() => {
    Object.values(Store.data.profiles).forEach(upgradeProfile);
    const d = Store.data;
    if (d.active && d.profiles[d.active]) enterApp(d.active); else { $('#profiles').hidden = false; renderProfiles(); }
  });
  Tutor.init();
  if (window.DARI_PWA && 'serviceWorker' in navigator && location.protocol === 'https:') {
    // Always re-check for a new version, and reload once when a new one takes over.
    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { r.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
  }
})();
