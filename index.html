<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F83"><meta name="description" content="Speakaboo: a free, talk-first way to learn languages with a cheeky Boo buddy who listens, laughs and helps.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Speakaboo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
</head><body>
<title>Speakaboo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* =========================================================
   DESIGN TOKENS — "Dari" cute theme
   Light palette on :root; dark redefined for system + explicit toggle.
   ========================================================= */
:root {
  --bg: #FFF8EE;  --surface: #FFFFFF;  --surface-2: #FBEFDF;  --line: #EADCC8;
  --ink: #08323F; --ink-2: #4E6B74;
  --berry: #1F6F83; --berry-deep: #08323F; --berry-soft: #DCEFF2; --on-berry: #FFFFFF; --berry-text: #1F6F83; --pink: #57B9C8;
  --jade: #11704F;  --jade-deep: #0A5039; --jade-soft: #D8F5EA;          /* correct */
  --gold: #FFC23D;  --gold-deep: #D99A00; --gold-soft: #FFF1C9; --gold-ink: #6A4A00; /* XP, stars */
  --coral: #D64545; --coral-soft: #FFE3E0;                               /* incorrect */
  --sky: #2B8C9C;   --sky-soft: #DDF1F3;  --on-sky: #FFFFFF;             /* selection, audio */
  --ember: #FF6B6B;
  --shadow: 0 1px 2px rgb(8 50 63 / .06), 0 10px 30px rgb(8 50 63 / .08);

  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cute-ko: "Jua", "Noto Sans KR", sans-serif;
  --font-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-ar: "Noto Naskh Arabic", "Geeza Pro", "Arabic Typesetting", serif;
  --script: var(--font-ko);

  --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-xl: 32px; --r-pill: 999px;
  --tap: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #06232C; --surface: #0B3240; --surface-2: #11414F; --line: #1C5263; --ink: #FFF2E1; --ink-2: #A9CBD2;
    --berry: #57B9C8; --berry-deep: #2B8C9C; --berry-soft: #0F4A57; --on-berry: #06232C; --berry-text: #7FD0DC; --pink: #57B9C8;
    --jade: #5FDDB0; --jade-deep: #2FA27D; --jade-soft: #173E33;
    --gold: #FFD35E; --gold-deep: #C99A1E; --gold-soft: #3F3312; --gold-ink: #FFE39A;
    --coral: #FF8A8A; --coral-soft: #4A2228; --sky: #7FD0DC; --sky-soft: #0F4A57; --on-sky: #06232C; --ember: #FF8A8A;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #06232C; --surface: #0B3240; --surface-2: #11414F; --line: #1C5263; --ink: #FFF2E1; --ink-2: #A9CBD2;
  --berry: #57B9C8; --berry-deep: #2B8C9C; --berry-soft: #0F4A57; --on-berry: #06232C; --berry-text: #7FD0DC; --pink: #57B9C8;
  --jade: #5FDDB0; --jade-deep: #2FA27D; --jade-soft: #173E33;
  --gold: #FFD35E; --gold-deep: #C99A1E; --gold-soft: #3F3312; --gold-ink: #FFE39A;
  --coral: #FF8A8A; --coral-soft: #4A2228; --sky: #7FD0DC; --sky-soft: #0F4A57; --on-sky: #06232C; --ember: #FF8A8A;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .3);
}

/* ========================= BASE ========================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.script { font-family: var(--script); }
[dir="rtl"].script { line-height: 1.8; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; flex: none; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); border: 0; border-radius: var(--r-md); padding: 12px 22px; font-weight: 800; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; transition: transform .08s, box-shadow .08s; }
.btn.primary { background: var(--berry); color: var(--on-berry); box-shadow: 0 4px 0 var(--berry-deep); }
.btn.good { background: var(--jade); color: #fff; box-shadow: 0 4px 0 var(--jade-deep); }
:root[data-theme="dark"] .btn.good { color: #062A1E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.good { color: #062A1E; } }
.btn.gold { background: var(--gold); color: #3E2A00; box-shadow: 0 4px 0 var(--gold-deep); }
.btn.ghost { background: var(--surface); color: var(--ink-2); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.danger { background: var(--coral); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--coral) 65%, #000); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 transparent; }
.btn:disabled { background: var(--surface-2); color: var(--ink-2); box-shadow: 0 4px 0 var(--line); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 36px; border-radius: var(--r-pill); background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: 15px; }
.chip.streak svg { color: var(--ember); } .chip.streak.cold svg { color: var(--ink-2); opacity: .5; }
.chip.xp svg { color: var(--gold-deep); } .chip.lvl svg { color: var(--berry); }

/* ========================= MASCOT ========================= */
.mascot { display: block; transform-origin: 50% 90%; }
.mascot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.m-happy { animation: breathe 3.2s ease-in-out infinite; }
.m-cheer { animation: bounce .4s cubic-bezier(.3,1.6,.5,1) 2; }
.m-shocked { animation: jolt .3s ease-in-out 2; }
.m-giggle { animation: wiggle .22s ease-in-out 3; }
.m-think { animation: tilt 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.035, .975); } }
@keyframes bounce { 40% { transform: translateY(-16px) scale(1.05); } }
@keyframes jolt { 30% { transform: translateY(-6px) scale(1.06); } 60% { transform: translateX(-4px); } }
@keyframes wiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes tilt { 50% { transform: rotate(-5deg); } }

/* ========================= PROFILES SCREEN ========================= */
.profiles { height: 100%; overflow-y: auto; padding: 32px 16px 48px; background:
  radial-gradient(circle at 12% 8%, var(--berry-soft) 0 90px, transparent 91px),
  radial-gradient(circle at 92% 20%, var(--sky-soft) 0 70px, transparent 71px),
  radial-gradient(circle at 80% 96%, var(--gold-soft) 0 110px, transparent 111px), var(--bg); }
.profiles-in { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.p-brand { font: 700 30px var(--font-display); color: var(--berry); display: flex; align-items: center; gap: 10px; }
.p-brand small { font: 400 18px var(--font-cute-ko); color: var(--ink-2); }
.profiles h1 { font-size: clamp(30px, 6vw, 44px); }
.p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.p-card { position: relative; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: var(--r-lg); padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; transition: transform .1s; min-height: 210px; }
.p-open { background: none; border: 0; width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 14px 16px; border-radius: inherit; }
.p-card.add { padding: 18px 14px; }
.p-card:hover { transform: translateY(-3px); border-color: var(--pink); }
.p-card .mascot { width: 104px; height: 104px; }
.p-card b { font: 600 20px var(--font-display); }
.p-card small { color: var(--ink-2); font-weight: 700; font-size: 13px; }
.p-card.add { border-style: dashed; color: var(--berry-text); justify-content: center; font-weight: 800; background: transparent; }
.p-card.add .plus { width: 64px; height: 64px; border-radius: 50%; background: var(--berry-soft); display: grid; place-items: center; font-size: 34px; }
.p-del { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--coral-soft); color: var(--coral); display: grid; place-items: center; }
.p-confirm { position: absolute; inset: 0; background: var(--surface); border-radius: inherit; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 12px; }
.p-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.p-form { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-weight: 800; }
.input { min-height: 52px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--surface); padding: 10px 16px; font-size: 17px; width: 100%; }
.input:focus { border-color: var(--sky); outline: none; }
.pick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 640px) { .pick-grid { grid-template-columns: repeat(2, 1fr); } }
.pick { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: var(--r-lg); background: var(--surface); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-height: var(--tap); }
.pick .mascot { width: 84px; height: 84px; }
.pick b { font: 600 17px var(--font-display); } .pick small { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.pick[aria-pressed="true"] { border-color: var(--berry); background: var(--berry-soft); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: var(--r-pill); padding: 8px 16px; min-height: 44px; font-weight: 800; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; }
.seg button .n { font-weight: 600; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg .tag { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--berry-text); }

/* ========================= APP SHELL =========================
   Mobile  (<768):   topbar / main / bottom nav
   Tablet  (768+):   icon rail | topbar + main
   Desktop (1100+):  labelled rail | main | right column (stats, quests, mascot)
   ============================================================= */
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "main" "nav"; }
.rail, .right { display: none; }
.topbar { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 2px solid var(--line); background: var(--surface); }
.topbar .spacer { flex: 1; }
.main { grid-area: main; position: relative; min-height: 0; overflow: hidden; }
.tab { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.pad { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
.bnav { grid-area: nav; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bnav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 11.5px; font-weight: 800; color: var(--ink-2); }
.bnav svg { width: 26px; height: 26px; padding: 3px 8px; box-sizing: content-box; border-radius: 12px; }
.bnav button[aria-current="page"] { color: var(--berry-text); }
.bnav button[aria-current="page"] svg { background: var(--berry-soft); box-shadow: inset 0 0 0 2px var(--pink); }

.stat { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 4px 8px; border-radius: var(--r-md); border: 0; background: none; font-weight: 800; font-size: 16px; }
.stat:hover { background: var(--surface-2); }
.stat svg { width: 24px; height: 24px; }
.stat.streak svg { color: var(--ember); } .stat.streak.cold svg { color: var(--ink-2); opacity: .45; }
.stat.gems svg { color: #3BA7E8; } .stat.hearts svg { color: var(--coral); }
.lang-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 12px 4px 6px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--surface); font-weight: 800; }
.lang-chip .flag { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--berry); color: var(--on-berry); font-size: 15px; font-weight: 700; }

@media (min-width: 768px) {
  .shell { grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "rail top" "rail main"; }
  .bnav { display: none; }
  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 6px; padding: 18px 12px; border-right: 2px solid var(--line); background: var(--surface); overflow-y: auto; }
  .rail .logo { font: 700 26px var(--font-display); color: var(--berry); text-align: center; padding: 4px 0 14px; }
  .rail .logo small { display: none; }
  .rail button.nav-i { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 56px; border-radius: var(--r-md); border: 2px solid transparent; background: none; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); padding: 6px 10px; }
  .rail button.nav-i span { display: none; }
  .rail button.nav-i svg { width: 30px; height: 30px; }
  .rail button.nav-i:hover { background: var(--surface-2); }
  .rail button.nav-i[aria-current="page"] { background: var(--berry-soft); border-color: var(--pink); color: var(--berry-text); }
  .rail .who-btn { margin-top: auto; }
  .pad { padding: 24px 24px 64px; }
}
@media (min-width: 1100px) {
  .shell { grid-template-columns: 250px minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr); grid-template-areas: "rail main right"; }
  .topbar { display: none; }
  .rail { padding: 22px 16px; }
  .rail .logo { text-align: left; padding: 4px 12px 18px; font-size: 32px; }
  .rail .logo small { display: inline; font: 400 15px var(--font-cute-ko); color: var(--ink-2); margin-left: 6px; }
  .rail button.nav-i { justify-content: flex-start; }
  .rail button.nav-i span { display: inline; }
  .right { grid-area: right; display: flex; flex-direction: column; gap: 16px; padding: 22px 24px 22px 8px; overflow-y: auto; }
  .right .stats-row { display: flex; justify-content: space-between; gap: 4px; }
}
.who-btn { display: flex; align-items: center; gap: 10px; padding: 6px; border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--surface); min-height: 56px; text-align: left; }
.who-btn .mascot { width: 42px; height: 42px; flex: none; }
.who-btn span { display: none; line-height: 1.2; } .who-btn small { display: block; color: var(--ink-2); font-size: 12px; font-weight: 700; }
@media (min-width: 1100px) { .who-btn span { display: block; } }
@media (min-width: 768px) and (max-width: 1099px) { .who-btn { justify-content: center; } }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.card h3 { font-size: 19px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 a, .card h3 button.link { font: 800 13px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--sky); background: none; border: 0; min-height: 36px; }
.mascot-card { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, var(--berry-soft), var(--sky-soft)); border: 0; }
.mascot-card .mascot { width: 92px; height: 92px; flex: none; }
.mascot-card .speech { background: var(--surface); border-radius: 16px; padding: 10px 12px; font-weight: 700; font-size: 14px; position: relative; box-shadow: var(--shadow); }

/* quests */
.quest { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.quest:last-child { border-bottom: 0; }
.quest .qi { width: 44px; height: 44px; border-radius: 14px; background: var(--gold-soft); color: var(--gold-deep); display: grid; place-items: center; }
.quest .qi svg { width: 26px; height: 26px; }
.quest b { display: block; font-size: 15px; }
.qbar { position: relative; height: 18px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.qbar i { position: absolute; inset: 0 auto 0 0; background: var(--gold); border-radius: 99px; transition: width .5s; }
.qbar span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 800; line-height: 18px; color: var(--ink); }
.quest.done .qi { background: var(--jade-soft); color: var(--jade); }
.shop-item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.shop-item:last-child { border-bottom: 0; }
.shop-item .ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--sky-soft); color: var(--sky); }
.shop-item .ic svg { width: 32px; height: 32px; }
.shop-item p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); }
.price { display: inline-flex; align-items: center; gap: 4px; }
.price svg { width: 18px; height: 18px; color: #3BA7E8; }

.scene-btn { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--surface); text-align: left; flex: 1; min-width: 0; }
.scene-btn svg { width: 26px; height: 26px; color: var(--berry); flex: none; }
.scene-btn span:first-of-type { flex: 1; min-width: 0; line-height: 1.2; }
.scene-btn b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene-btn small { color: var(--ink-2); font-weight: 700; font-size: 12.5px; }
.scene-btn .chev { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--sky); }
.scene-prog { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; width: 100%; margin-top: 6px; }
.scene-prog i { display: block; height: 100%; background: var(--jade); transition: width .4s; }
#topics { flex-wrap: wrap; overflow: visible; }
.scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.scene-card { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; min-height: 110px; border-radius: var(--r-lg); border: 2px solid var(--line); border-bottom-width: 5px; background: var(--surface); }
.scene-card.on { border-color: var(--berry); background: var(--berry-soft); }
.scene-card b { font: 600 17px var(--font-display); }
.scene-card small { color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
.scene-meta { margin-top: auto; font-size: 12px; font-weight: 800; color: var(--sky); letter-spacing: .02em; }
.done-tag { color: var(--jade); }
.skip-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin: 8px 0 4px; border-radius: var(--r-lg); border: 2px dashed var(--pink); background: var(--berry-soft); }
.skip-card div { flex: 1; } .skip-card b { display: block; font: 600 17px var(--font-display); } .skip-card small { color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
/* ========================= LEARN PATH ========================= */
.section-head { text-align: center; margin: 30px 0 6px; color: var(--ink-2); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; display: flex; align-items: center; gap: 12px; }
.section-head::before, .section-head::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.unit { margin-top: 18px; }
.unit-banner { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 14px 16px; border-radius: var(--r-lg); background: var(--berry); color: var(--on-berry); box-shadow: 0 4px 0 var(--berry-deep); }
.unit-banner .eyebrow { color: inherit; opacity: .85; }
.unit-banner h2 { font-size: 21px; margin-top: 2px; }
.unit.c1 .unit-banner { background: var(--sky); color: var(--on-sky); box-shadow: 0 4px 0 color-mix(in srgb, var(--sky) 60%, #000); }
.unit.c2 .unit-banner { background: var(--jade); color: #fff; box-shadow: 0 4px 0 var(--jade-deep); }
.unit.c3 .unit-banner { background: var(--gold); color: #3E2A00; box-shadow: 0 4px 0 var(--gold-deep); }
:root[data-theme="dark"] .unit.c2 .unit-banner { color: #062A1E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .unit.c2 .unit-banner { color: #062A1E; } }
.guide-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 14px; border-radius: var(--r-md); border: 2px solid rgb(255 255 255 / .45); background: rgb(255 255 255 / .12); color: inherit; font-weight: 800; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.guide-btn svg { width: 22px; height: 22px; }
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 56px 0 10px; }
.stop { position: relative; z-index: 1; transform: translateX(var(--x, 0)); display: flex; flex-direction: column; align-items: center; }
.stop.popped { z-index: 5; }
.node { width: 76px; height: 70px; border-radius: 50%; border: 0; display: grid; place-items: center; position: relative; transition: transform .08s, box-shadow .08s; }
.node svg { width: 34px; height: 34px; }
.node.open { background: var(--berry); color: var(--on-berry); box-shadow: 0 7px 0 var(--berry-deep); }
.unit.c1 .node.open { background: var(--sky); color: var(--on-sky); box-shadow: 0 7px 0 color-mix(in srgb, var(--sky) 60%, #000); }
.unit.c2 .node.open { background: var(--jade); color: #fff; box-shadow: 0 7px 0 var(--jade-deep); }
.unit.c3 .node.open { background: var(--gold); color: #3E2A00; box-shadow: 0 7px 0 var(--gold-deep); }
.node.done { background: var(--gold); color: #3E2A00; box-shadow: 0 7px 0 var(--gold-deep); }
.node.locked { background: var(--surface-2); color: var(--ink-2); box-shadow: 0 7px 0 var(--line); }
.node.chest { border-radius: 22px; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--line) !important; }
.node.current::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid currentColor; opacity: 0; }
.node.current { outline: 6px solid color-mix(in srgb, var(--berry) 22%, transparent); outline-offset: 6px; }
.start-tip { position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); white-space: nowrap; font: 800 14px var(--font-body); letter-spacing: .06em; text-transform: uppercase; background: var(--surface); color: var(--berry-text); border: 2px solid var(--line); border-radius: var(--r-sm); padding: 6px 12px; animation: bob 1.6s ease-in-out infinite; }
.start-tip::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--line); }
@keyframes bob { 50% { transform: translate(-50%, -4px); } }
.path-mascot { position: absolute; top: 150px; z-index: 0; width: 110px; height: 110px; pointer-events: none; }
.path-mascot.l { left: 2%; } .path-mascot.r { right: 2%; }
@media (max-width: 420px) { .path-mascot { width: 84px; height: 84px; } }
.pop-card { position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%); z-index: 6; width: min(320px, calc(100vw - 32px)); background: var(--berry); color: var(--on-berry); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); text-align: left; }
.unit.c1 .pop-card { background: var(--sky); color: var(--on-sky); } .unit.c2 .pop-card { background: var(--jade); color: #fff; } .unit.c3 .pop-card { background: var(--gold); color: #3E2A00; }
.pop-card.locked { background: var(--surface) !important; color: var(--ink) !important; border: 2px solid var(--line); }
.pop-card::before { content: ""; position: absolute; bottom: 100%; left: 50%; margin-left: -9px; border: 9px solid transparent; border-bottom-color: inherit; }
.pop-card b { font: 600 19px var(--font-display); display: block; }
.pop-card p { margin: 4px 0 12px; font-size: 14.5px; font-weight: 600; opacity: .92; }
.pop-card .btn { width: 100%; background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 rgb(0 0 0 / .18); }
.pop-card.locked .btn { background: var(--berry); color: var(--on-berry); box-shadow: 0 4px 0 var(--berry-deep); }
.unit-end { text-align: center; color: var(--ink-2); font-size: 13px; font-weight: 700; padding: 6px 0 0; }

/* bottom sheet (guidebook, language picker, install help, out of hearts) */
.sheet-wrap { position: fixed; inset: 0; z-index: 65; background: rgb(27 21 38 / .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 680px; max-height: 88%; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 12px 18px calc(24px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .28s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 768px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 28px; max-height: 84%; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } }
.sheet-grip { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sheet-head h2 { font-size: 24px; }
.guide-card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; }
.guide-card h3 { font-size: 18px; margin-bottom: 6px; }
.guide-card p { margin: 0 0 10px; }
.ex-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.ex-row .script { font-size: 20px; font-weight: 600; }
.ex-row small { display: block; color: var(--ink-2); font-size: 13px; font-weight: 700; }
.lang-opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 14px; border-radius: var(--r-lg); border: 2px solid var(--line); background: var(--surface); margin-bottom: 10px; text-align: left; font-weight: 800; }
.lang-opt[aria-pressed="true"] { border-color: var(--berry); background: var(--berry-soft); }
.lang-opt .flag { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--berry); color: var(--on-berry); font-size: 20px; }
.lang-opt small { display: block; color: var(--ink-2); font-weight: 600; }
.install-banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--sky-soft); margin-bottom: 14px; }
.install-banner p { margin: 0; flex: 1; font-size: 14px; font-weight: 700; }

/* ========================= CHAT ========================= */
.chat { height: 100%; display: flex; flex-direction: column; }
.chat-head { padding: 10px 16px; display: flex; gap: 8px; align-items: center; border-bottom: 2px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.topics { display: flex; flex-wrap: wrap; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px; }
.topics::-webkit-scrollbar { display: none; }
.topic { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 6px 14px; min-height: 44px; font-weight: 800; font-size: 14px; color: var(--ink-2); }
.topic[aria-pressed="true"] { border-color: var(--berry); background: var(--berry-soft); color: var(--berry-text); }
.brain { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--ink-2); border-radius: var(--r-pill); background: var(--surface-2); padding: 6px 10px; min-height: 36px; border: 0; }
.brain i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); } .brain.live i { background: var(--jade); box-shadow: 0 0 0 3px var(--jade-soft); }
@media (max-width: 640px) { .topics { flex-basis: 100%; order: 2; } .chat-head { justify-content: flex-end; } }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.chat-log > * { width: 100%; max-width: 760px; margin-left: auto; margin-right: auto; }
.msg { display: flex; gap: 10px; align-items: flex-end; }
.msg .mascot { width: 44px; height: 44px; flex: none; }
.msg.me { justify-content: flex-end; }
.bub { border-radius: 22px 22px 22px 6px; padding: 12px 14px; background: var(--surface); border: 2px solid var(--line); max-width: min(560px, 100%); min-width: 0; }
.msg.me .bub { background: var(--berry); color: var(--on-berry); border-color: var(--berry); border-radius: 22px 22px 6px 22px; font-weight: 600; }
.msg.me .bub small { display: block; opacity: .85; font-size: 12px; font-weight: 700; }
.joke { background: var(--gold-soft); color: var(--gold-ink); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
.fix { border: 2px dashed var(--coral); border-radius: 14px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.fix del { color: var(--coral); font-weight: 700; } .fix ins { color: var(--jade); text-decoration: none; font-weight: 800; font-size: 17px; }
.heard { font-size: 14px; color: var(--ink-2); font-weight: 700; margin-bottom: 6px; }
.t-line { display: flex; gap: 10px; align-items: flex-start; }
.t-main { font-size: 22px; line-height: 1.45; font-weight: 500; flex: 1; min-width: 0; }
.t-rom { color: var(--ink-2); font-size: 14px; font-weight: 700; }
.t-en { font-size: 14.5px; margin-top: 2px; }
.award { align-self: center; font-size: 13px; font-weight: 800; color: var(--gold-ink); background: var(--gold-soft); border-radius: var(--r-pill); padding: 4px 12px; width: auto !important; }
.award.word { color: var(--sky); background: var(--sky-soft); }
.typing { display: inline-flex; gap: 5px; padding: 6px 2px; } .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); animation: dot 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-5px); opacity: .5; } }
.suggest { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 0; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.sug { flex: none; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: var(--r-md); padding: 6px 12px; min-height: var(--tap); text-align: left; display: flex; flex-direction: column; justify-content: center; line-height: 1.25; }
.sug .script { font-size: 16px; font-weight: 600; } .sug small { color: var(--ink-2); font-size: 11.5px; font-weight: 700; }
.sug.help { border-style: dashed; color: var(--ink-2); font-weight: 800; }
.composer { display: flex; gap: 8px; padding: 10px 16px 12px; align-items: center; }
.composer .input { border-radius: var(--r-pill); flex: 1; min-width: 0; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; }
.round.mic { background: var(--sky); color: var(--on-sky); box-shadow: 0 4px 0 color-mix(in srgb, var(--sky) 60%, #000); position: relative; }
.round.mic.on::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--sky); animation: ring 1.1s ease-out infinite; }
.round.mic:disabled { background: var(--surface-2); color: var(--ink-2); box-shadow: 0 4px 0 var(--line); }
.round.send { background: var(--berry); color: var(--on-berry); box-shadow: 0 4px 0 var(--berry-deep); }
.round:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.chat-note { font-size: 12px; color: var(--ink-2); text-align: center; padding: 0 16px 8px; }
@keyframes ring { from { transform: scale(.9); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }

.progress { height: 14px; background: var(--surface-2); border-radius: var(--r-pill); overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--berry)); border-radius: inherit; transition: width .5s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 -4px 0 rgb(0 0 0 / .1); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.panel h3 { font-size: 18px; margin-bottom: 12px; }
.goal { display: flex; gap: 16px; align-items: center; }
.ring { width: 76px; height: 76px; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-2); } .ring .val { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .6s; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font: 700 17px var(--font-display); fill: var(--ink); }
.goal p { margin: 0; color: var(--ink-2); font-size: 14px; }
.goal strong { display: block; font-size: 19px; font-family: var(--font-display); color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.practice-hero { display: flex; gap: 14px; align-items: center; background: var(--berry); color: var(--on-berry); border: 0; }
.practice-hero .mascot { width: 88px; height: 88px; flex: none; }
.practice-hero p { margin: 4px 0 12px; font-weight: 600; opacity: .92; }
.practice-hero .btn { background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 rgb(0 0 0 / .18); }
.drills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.drill { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 16px; border-radius: var(--r-lg); border: 2px solid var(--line); border-bottom-width: 5px; background: var(--surface); min-height: 120px; }
.drill .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--sky-soft); color: var(--sky); }
.drill .ic svg { width: 26px; height: 26px; }
.drill b { font: 600 17px var(--font-display); } .drill small { color: var(--ink-2); font-weight: 600; }
.drill:disabled { opacity: .5; }
/* ========================= WORDS / ME ========================= */
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 560px) { .kv { grid-template-columns: repeat(2, 1fr); } }
.kv div { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); padding: 12px; }
.kv b { display: block; font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
.kv span { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: start; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.words { display: flex; flex-direction: column; }
.word { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.word:last-child { border-bottom: 0; }
.word .script { font-size: 20px; font-weight: 500; }
.word small { display: block; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.strength { display: flex; gap: 3px; } .strength i { width: 7px; height: 16px; border-radius: 3px; background: var(--surface-2); } .strength i.on { background: var(--jade); }
.jokes { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
.jokes li { list-style: none; background: var(--gold-soft); color: var(--gold-ink); border-radius: 14px; padding: 10px 12px; font-weight: 600; font-size: 14px; }
.jokes ul { padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.badge { aspect-ratio: 1; max-width: 100%; border-radius: 20px; display: grid; place-items: center; font: 700 20px var(--font-display); background: var(--surface-2); color: var(--ink-2); opacity: .5; border: 0; padding: 0; min-height: var(--tap); }
.badge.on { background: var(--gold-soft); color: var(--gold-ink); opacity: 1; box-shadow: inset 0 0 0 3px var(--gold); }
.badge .g-ko { font-family: var(--font-cute-ko); font-weight: 400; font-size: 24px; } .badge .g-ar { font-family: var(--font-ar); }
.badge-info { margin-top: 10px; font-size: 14px; color: var(--ink-2); min-height: 2.6em; }
.badge-info b { color: var(--ink); }
.settings { display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
.settings label.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: var(--tap); }
.settings select, .settings .input { min-height: 44px; font-size: 15px; }
.settings select { border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--surface); padding: 6px 10px; }
.toggle { appearance: none; width: 52px; height: 32px; border-radius: 99px; background: var(--surface-2); position: relative; cursor: pointer; border: 2px solid var(--line); transition: background .2s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.toggle:checked { background: var(--berry); border-color: var(--berry); } .toggle:checked::after { transform: translateX(20px); }
.note { font-size: 13px; color: var(--ink-2); margin: 0; }
.me-card { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.me-card .mascot { width: 96px; height: 96px; }

/* ========================= LESSON OVERLAY ========================= */
.lesson { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); }
.l-top { max-width: 760px; width: 100%; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.l-top .mascot { width: 52px; height: 52px; flex: none; }
.icon-btn { width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.l-top .progress { flex: 1; height: 18px; }
.l-xp { font-weight: 800; color: var(--gold-ink); min-width: 60px; text-align: right; }
.l-stage { overflow-y: auto; padding: 8px 16px 32px; position: relative; }
.l-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: slideIn .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slideIn { from { transform: translateX(24px); opacity: .3; } }
.q { font: 600 24px/1.2 var(--font-display); margin: 8px 0 0; }
.prompt { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.prompt-text { font-size: 44px; font-weight: 600; line-height: 1.25; }
.prompt-text.latin { font-family: var(--font-display); font-size: 30px; }
.prompt-sub { color: var(--ink-2); width: 100%; }
.speaker { width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--sky); color: var(--on-sky); display: grid; place-items: center; box-shadow: 0 4px 0 color-mix(in srgb, var(--sky) 60%, #000); flex: none; }
.speaker.big { width: 96px; height: 96px; border-radius: 28px; } .speaker.big svg { width: 44px; height: 44px; }
.speaker.slow { width: 52px; height: 52px; background: var(--sky-soft); color: var(--sky); box-shadow: 0 4px 0 var(--line); }
.speaker.sm { width: 44px; height: 44px; border-radius: 14px; box-shadow: 0 3px 0 color-mix(in srgb, var(--sky) 60%, #000); } .speaker.sm svg { width: 20px; height: 20px; }
.speaker:active { transform: translateY(3px); box-shadow: none; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; min-height: 60px; border-radius: var(--r-md); background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; font-size: 17px; font-weight: 700; transition: background .12s, border-color .12s, transform .08s; }
.opt.script { font-size: 22px; font-weight: 500; }
.opt kbd { font: 800 12px var(--font-body); color: var(--ink-2); border: 2px solid var(--line); border-radius: 8px; min-width: 26px; height: 26px; display: grid; place-items: center; flex: none; }
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt.sel { border-color: var(--sky); background: var(--sky-soft); } .opt.sel kbd { border-color: var(--sky); color: var(--sky); }
.opt.right { border-color: var(--jade); background: var(--jade-soft); } .opt.right kbd { border-color: var(--jade); color: var(--jade); }
.opt.wrong { border-color: var(--coral); background: var(--coral-soft); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.flip { perspective: 1200px; width: min(100%, 340px); aspect-ratio: 4 / 5; max-width: 100%; margin: 0 auto; border: 0; background: none; padding: 0; }
.flip-in { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r-xl); background: var(--surface); border: 2px solid var(--line); border-bottom-width: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
.face.back { transform: rotateY(180deg); background: var(--berry-soft); border-color: var(--pink); }
.face .big { font-size: clamp(64px, 20vw, 120px); line-height: 1.1; font-weight: 500; }

.mood:active { transform: translateY(3px); border-bottom-width: 2px; }
.mood .art { width: 52px; height: 52px; } .mood b { font: 600 15px var(--font-display); } .mood small { color: var(--ink-2); font-weight: 600; font-size: 11.5px; line-height: 1.25; }
.mood[data-feel="sleepy"] { background: #E9F3F5; } .mood[data-feel="chatty"] { background: #FFECE8; } .mood[data-feel="focused"] { background: #EAF8F1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mood[data-feel] { background: var(--surface-2); } }
:root[data-theme="dark"] .mood[data-feel] { background: var(--surface-2); }
.garden .plants { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.plot { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 4px 8px; border-radius: 14px; border: 0; background: linear-gradient(#EAF8FF00, #E9F7E2); }
.plot .plant { width: 70px; height: 70px; } .plot.wilt .plant { filter: saturate(.6); }
.plot .script { font-weight: 800; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plot small { font-size: 11px; color: var(--ink-2); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.water-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--sky-soft); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; } .water-row p { margin: 0; }
.btn.sky { background: var(--sky); color: #fff; box-shadow: 0 4px 0 #4F3AA8; }
.garden-empty { display: flex; gap: 10px; align-items: center; } .garden-empty .plant { width: 80px; height: 80px; flex: none; }
.oops-sent { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0 6px; }
.oops-w { display: inline-flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 700; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 5px; background: var(--surface); }
.oops-w.right { border-color: var(--jade); background: var(--jade-soft); } .oops-w.wrong { border-color: var(--coral); background: var(--coral-soft); animation: shake .35s; }
.oops-w s { color: var(--coral); opacity: .8; font-size: 16px; }
.oops-en { text-align: center; }
.echo { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.echo [data-echo-rec] { color: var(--coral); } .echo [data-echo-rec].on { background: var(--coral-soft); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }

/* ---------- Talk buddy game ---------- */
.challenge { display: flex; align-items: center; gap: 10px; background: var(--sky-soft); border: 2px dashed var(--sky); border-radius: 14px; padding: 10px 12px; margin: 4px 0; }
.challenge .ch-en { font: 600 19px var(--font-display); color: var(--ink); flex: 1; }
.game-tools { display: flex; gap: 8px; flex-wrap: wrap; flex-basis: 100%; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 36px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 13px; color: var(--ink-2); }
.chip-btn svg { width: 16px; height: 16px; } .chip-btn.on { border-color: var(--jade); color: var(--jade); background: var(--jade-soft); }

/* =====================================================================
   SPEAKABOO LOOK: Boo stage, episodes with peeking Boos, floating dock,
   Boo trail in lessons, speech-card feedback.
   ===================================================================== */
.brand-boo { display: inline-grid; width: 40px; height: 40px; flex: none; } .brand-boo svg { width: 100%; height: 100%; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 26px !important; } .logo span { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.rail button.nav-i { text-transform: none; letter-spacing: 0; font-size: 16px; border-radius: 20px; }
.rail button.nav-i[data-tab="chat"] { background: var(--berry); color: #fff; box-shadow: 0 4px 0 var(--berry-deep); }
.rail button.nav-i[data-tab="chat"][aria-current="page"] { background: var(--berry-deep); }
.chat { padding-bottom: 22px; }
@media (min-width: 900px) { .chat { padding-bottom: 0; } }
.l-foot.ok .fb .mascot, .l-foot.bad .fb .mascot { width: 64px !important; height: 64px !important; top: -44px !important; }
.p-brand { display: inline-flex; align-items: center; gap: 8px; }
.boo-stage { position: relative; border-radius: 30px; padding: 16px 16px 14px; margin: 4px 0 16px; overflow: hidden;
  background: linear-gradient(135deg, var(--stage-a, #FFF2E1), var(--stage-b, #DDF1F3) 75%);
  border: 2px solid var(--line); display: grid; grid-template-columns: 128px 1fr; grid-template-areas: "boo bubble" "act act"; gap: 6px 10px; align-items: center; }
.stage-boo { grid-area: boo; width: 128px; height: 128px; border: 0; background: none; padding: 0; cursor: pointer; }
.stage-boo svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 0 rgb(8 50 63 / .12)); }
.stage-boo:active { transform: scale(.94); }
.stage-bubble { grid-area: bubble; position: relative; background: var(--surface); border-radius: 22px; padding: 12px 14px; box-shadow: 0 3px 0 rgb(8 50 63 / .12); display: flex; flex-direction: column; gap: 4px; }
.stage-bubble::before { content: ""; position: absolute; left: -10px; top: 46%; border: 10px solid transparent; border-right-color: var(--surface); border-left: 0; }
.stage-bubble b { font: 600 13px var(--font-display); color: var(--berry-text); text-transform: uppercase; letter-spacing: .06em; }
.stage-bubble span { font-weight: 700; line-height: 1.35; }
.stage-bubble.pop { animation: bubblePop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bubblePop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.peek-word { color: var(--ink); max-width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: var(--berry-soft); border-radius: 16px; padding: 6px 10px; text-align: start; }
.peek-word .art { width: 54px; height: 54px; flex: none; } .peek-word .script { font-size: 20px; word-break: keep-all; font-weight: 800; display: block; } .peek-word small { color: var(--ink-2); font-weight: 600; }
.stage-actions { grid-area: act; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.stage-btn { display: flex; align-items: center; gap: 10px; text-align: start; border: 0; border-radius: 20px; padding: 12px; min-height: 64px; color: #fff; }
.stage-btn svg { width: 28px; height: 28px; flex: none; } .stage-btn b { display: block; font: 600 16px var(--font-display); } .stage-btn small { opacity: .9; font-weight: 600; font-size: 12px; line-height: 1.2; display: block; }
.stage-btn.talk { background: var(--berry); box-shadow: 0 5px 0 var(--berry-deep); }
.stage-btn.next { background: var(--sky); box-shadow: 0 5px 0 #4F3AA8; }
.stage-btn:active { transform: translateY(4px); box-shadow: none; }
@media (max-width: 380px) { .stage-actions { grid-template-columns: 1fr; } }
.mood-card { padding: 10px 12px; border-radius: 22px; } .mood-q .mascot { display: none; } .mood-q b { font-size: 15px; } .mood .art { width: 40px; height: 40px; }
.season-head { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin: 26px 4px 8px; }
.season-tag { font: 700 12px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--berry); border-radius: 999px; padding: 4px 12px; transform: rotate(-2deg); }
.season-head b { font: 600 22px var(--font-display); margin-top: 6px; } .season-head small { color: var(--ink-2); font-weight: 600; }
.ep { --ep: var(--berry); --ep-soft: var(--berry-soft); --ep-deep: var(--berry-deep); position: relative; margin: 34px 0 6px; padding: 14px 14px 16px; border-radius: 26px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 6px 0 var(--line); }
.ep.c1 { --ep: var(--sky); --ep-soft: var(--sky-soft); --ep-deep: #4F3AA8; } .ep.c2 { --ep: var(--jade); --ep-soft: var(--jade-soft); --ep-deep: var(--jade-deep); } .ep.c3 { --ep: #E0A100; --ep-soft: #FFF3CC; --ep-deep: #B07D00; }
.ep::before { content: ""; position: absolute; left: 18px; right: 18px; top: -2px; height: 6px; border-radius: 0 0 6px 6px; background: var(--ep); }
.ep.now { border-color: var(--ep); box-shadow: 0 6px 0 var(--ep-deep); }
.ep.locked { opacity: .8; }
.ep-boo { position: absolute; right: 16px; top: -46px; width: 72px; height: 72px; z-index: 1; pointer-events: none; }
.ep-head { display: flex; align-items: center; gap: 12px; } .ep-title { padding-right: 4px; }
.ep-icon { width: 52px; height: 52px; border-radius: 18px; flex: none; display: grid; place-items: center; background: var(--ep-soft); color: var(--ep-deep); font: 700 18px var(--font-display); transform: rotate(-4deg); border: 2px solid var(--ep); }
.ep-title { flex: 1; min-width: 0; } .ep-title h2 { font-size: 19px; margin: 1px 0; } .ep-title small { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
.ep-head .guide-btn { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); border: 0; }
.ep-head .guide-btn span { display: none; } .ep-head .guide-btn svg { width: 20px; height: 20px; }
.ep-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
.win { position: relative; aspect-ratio: 1; border-radius: 16px 16px 12px 12px; border: 3px solid var(--line); background: var(--surface-2); padding: 3px; display: grid; }
.win-in { border-radius: 11px 11px 8px 8px; display: grid; place-items: center; font: 700 18px var(--font-display); color: var(--ink-2); overflow: hidden; }
.win-in svg { width: 22px; height: 22px; }
.win.open { border-color: var(--ep); background: var(--ep-soft); } .win.open .win-in { background: var(--ep); color: #fff; }
.win.done { border-color: var(--gold); background: #FFF3CC; } .win.done .win-in { background: var(--gold); color: #3E2A00; }
.win.locked .win-in { background: repeating-linear-gradient(0deg, var(--surface-2) 0 6px, var(--line) 6px 8px); }
.win.trophy { border-radius: 50%; } .win.trophy .win-in { border-radius: 50%; }
.win.current { animation: winBob 1.6s ease-in-out infinite; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ep) 25%, transparent); }
@keyframes winBob { 50% { transform: translateY(-4px); } }
.win-tip { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font: 700 11px var(--font-body); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.win:active { transform: scale(.92); }
.node-sheet { display: flex; gap: 14px; align-items: flex-start; } .node-sheet .mascot { width: 92px; height: 92px; flex: none; }
.ns-body { flex: 1; display: flex; flex-direction: column; gap: 8px; } .ns-body b { font: 600 20px var(--font-display); } .ns-body p { margin: 0; color: var(--ink-2); font-weight: 600; } .ns-body .btn { background: var(--berry); color: #fff; box-shadow: 0 4px 0 var(--berry-deep); } .node-sheet.locked .ns-body .btn { background: var(--sky); box-shadow: 0 4px 0 #4F3AA8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boo-stage { --stage-a: #0B3240; --stage-b: #11414F; border-color: var(--line); } }
:root[data-theme="dark"] .boo-stage { --stage-a: #0B3240; --stage-b: #11414F; border-color: var(--line); }
/* Floating dock with a big Talk button in the middle */
.bnav { margin: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); padding: 4px 6px; border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 8px 24px rgb(51 34 63 / .12); }
.bnav button { min-height: 56px; border-radius: 22px; }
.bnav button[aria-current="page"] svg { box-shadow: none; }
.bnav button[data-tab="chat"] { position: relative; }
.bnav button[data-tab="chat"] svg { width: 30px; height: 30px; padding: 14px; border-radius: 50%; background: var(--berry); color: #fff; margin-top: -30px; box-shadow: 0 5px 0 var(--berry-deep), 0 0 0 5px var(--bg); }
.bnav button[data-tab="chat"][aria-current="page"] svg { background: var(--berry-deep); box-shadow: 0 3px 0 #6E1838, 0 0 0 5px var(--bg); }
/* Lessons: Boo walks along a dotted trail, feedback is a speech card */
.trail { position: relative; flex: 1; height: 14px; border-radius: 999px; background: var(--surface-2); margin: 0 18px 0 6px; }
.trail #l-bar { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--berry)); transition: width .45s; }
.trail-boo { position: absolute; top: 50%; left: 0; width: 46px; height: 46px; transform: translate(-50%, -62%); transition: left .45s cubic-bezier(.3, 1.4, .5, 1); }
.trail-flag { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 22px; text-shadow: 0 2px 0 var(--gold-deep); }
.l-top { padding-top: 18px; }
.l-stage { background: transparent; }
.l-foot.ok, .l-foot.bad { position: relative; margin: 0 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-radius: 28px; border: 2px solid; padding-top: 24px; box-shadow: 0 10px 30px rgb(51 34 63 / .14); animation: cardUp .3s cubic-bezier(.3, 1.4, .5, 1); }
.l-foot.ok { border-color: var(--jade); } .l-foot.bad { border-color: var(--coral); }
@keyframes cardUp { from { transform: translateY(40px); opacity: 0; } }
.l-foot.ok .fb .mascot, .l-foot.bad .fb .mascot { position: absolute; top: -50px; left: 18px; width: 74px; height: 74px; }
.l-foot.ok .fb, .l-foot.bad .fb { padding-top: 8px; }
.mascot.m-peek { animation: peekPop .6s ease; } @keyframes peekPop { 0% { transform: scale(.9); } 60% { transform: scale(1.06) rotate(-3deg); } }

/* ---------- Fading Boo, Daily Peekaboo, wardrobe ---------- */
.stage-boo svg, [data-mascot-live] svg, .wb-boo svg { transition: filter .6s, opacity .6s; }
body[data-boo="bored"] :is(.stage-boo, [data-mascot-live]) svg { filter: saturate(.85); }
body[data-boo="missing"] :is(.stage-boo, [data-mascot-live]) svg { filter: saturate(.65) drop-shadow(0 6px 0 rgb(8 50 63 / .1)); opacity: .9; }
body[data-boo="fading"] :is(.stage-boo, [data-mascot-live]) svg, .welcome-back.fading .wb-boo svg { filter: grayscale(.55) saturate(.6); opacity: .6; }
body[data-boo="ghosted"] :is(.stage-boo, [data-mascot-live]) svg, .welcome-back.ghosted .wb-boo svg { filter: grayscale(1) blur(.3px); opacity: .32; animation: ghostDrift 3s ease-in-out infinite; }
body[data-boo="glow"] .stage-boo svg { filter: drop-shadow(0 0 12px rgb(255 194 61 / .65)); }
@keyframes ghostDrift { 50% { transform: translateY(-6px); } }
.welcome-back { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.welcome-back .wb-boo { width: 130px; height: 130px; } .welcome-back p { color: var(--ink-2); font-weight: 600; margin: 0 0 8px; }
.welcome-back .stack { width: 100%; }
.panel.revive .revive-boo { width: 130px; height: 130px; animation: revive 1.2s ease; }
@keyframes revive { 0% { filter: grayscale(1); opacity: .3; transform: scale(.8); } 60% { filter: grayscale(0) brightness(1.2); opacity: 1; transform: scale(1.12); } 100% { transform: scale(1); } }
.daily { border-radius: 26px; padding: 14px; margin: 0 0 16px; background: var(--surface); border: 2px dashed var(--sky); }
.daily-top { display: flex; flex-direction: column; gap: 2px; } .daily-top b { font: 600 18px var(--font-display); } .daily-top small { color: var(--ink-2); font-weight: 600; }
.daily-tag { align-self: flex-start; font: 700 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--sky); border-radius: 999px; padding: 3px 10px; transform: rotate(-2deg); margin-bottom: 4px; }
.spots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.spot { position: relative; aspect-ratio: 1 / 1.05; border-radius: 20px; border: 2px solid var(--line); border-bottom-width: 6px; background: var(--sky-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; overflow: hidden; }
.spot .art { width: 72%; height: auto; transition: transform .2s; } .spot:not(.tried):hover .art { transform: rotate(-4deg) scale(1.04); }
.spot:not(.tried) { animation: spotWiggle 3.5s ease-in-out infinite; } .spot:nth-child(2) { animation-delay: .6s; } .spot:nth-child(3) { animation-delay: 1.2s; }
@keyframes spotWiggle { 0%, 88%, 100% { transform: none; } 92% { transform: rotate(-3deg); } 96% { transform: rotate(3deg); } }
.spot.tried { background: var(--surface-2); opacity: .85; } .spot.tried .art { width: 44%; } .spot small { font-size: 10.5px; font-weight: 700; color: var(--ink-2); line-height: 1.2; text-align: center; }
.peek-eyes { position: absolute; top: 10px; right: 12px; width: 16px; height: 6px; background: radial-gradient(circle, var(--ink) 2px, transparent 2.5px) 0 0 / 8px 6px repeat-x; opacity: .0; }
.daily.found { border-style: solid; border-color: var(--berry); background: linear-gradient(135deg, var(--berry-soft), var(--surface)); }
.daily.found .daily-top { flex-direction: row; align-items: center; gap: 10px; } .daily.found .mascot { width: 64px; height: 64px; flex: none; }
.daily-word { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--surface); border-radius: 18px; padding: 8px 12px; margin: 10px 0; text-align: start; color: var(--ink); }
.daily-word .art { width: 70px; height: 70px; flex: none; } .daily-word .script { font-size: 26px; font-weight: 800; display: block; } .daily-word small { color: var(--ink-2); font-weight: 600; }
.daily-opts { display: flex; flex-wrap: wrap; gap: 8px; } .chip-btn.big { font-size: 15px; min-height: 44px; padding: 8px 16px; color: var(--ink); }
.daily.done { display: flex; align-items: center; gap: 12px; border-style: solid; border-color: var(--line); }
.daily-done-art .art { width: 64px; height: 64px; } .daily.done b { font: 600 15px var(--font-display); display: block; }
.dw { border: 0; background: none; padding: 0; text-align: start; display: block; color: var(--ink); } .dw .script { font-size: 22px; font-weight: 800; } .dw small { display: block; color: var(--ink-2); font-weight: 600; }
.wear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.wear { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 18px; border: 2px solid var(--line); border-bottom-width: 5px; background: var(--surface); }
.wear-art { width: 66px; height: 66px; display: block; } .wear-art svg { width: 100%; height: 100%; }
.wear small { font-weight: 700; font-size: 11.5px; color: var(--ink-2); text-align: center; }
.wear.on { border-color: var(--berry); background: var(--berry-soft); } .wear.locked .wear-art { filter: grayscale(1) brightness(1.15); opacity: .4; }

/* ---------- Cuter, livelier Boos: blinking, breathing, quick reactions ---------- */
.mascot svg .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.mascot:nth-child(2n) svg .eye { animation-delay: 1.3s; } .stage-boo svg .eye { animation-duration: 3.6s; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
:is(.stage-boo, .ep-boo, [data-mascot-live], .trail-boo, .wb-boo) > svg { animation: breathe 2.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }
.mascot.m-cheer svg .arm-r, .mascot.m-cheer svg .arm-l { transform-box: fill-box; transform-origin: 50% 80%; animation: wave .35s ease-in-out 3 alternate; }
@keyframes wave { to { transform: rotate(-35deg) translateY(-4px); } }

/* ---------- Call Boo ---------- */
.stage-btn.call { grid-column: 1 / -1; }
.call-chip { border-color: #FF6B6B; color: #C94848; }
.call-screen { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(circle at 50% 30%, #FFF2E1, #DDF1F3 60%, #CDE9EE); color: var(--ink); overflow-y: auto; animation: cardUp .35s cubic-bezier(.3, 1.4, .5, 1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .call-screen { background: radial-gradient(circle at 50% 30%, #0B3240, #11414F 60%, #06232C); } }
:root[data-theme="dark"] .call-screen { background: radial-gradient(circle at 50% 30%, #0B3240, #11414F 60%, #06232C); }
.call-top { display: flex; align-items: center; gap: 8px; font-weight: 700; } .call-time { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.call-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--jade); animation: pulse 1.2s infinite; }
.call-boo { position: relative; width: 200px; height: 200px; display: grid; place-items: center; margin-top: 10px; }
.call-boo .mascot { width: 180px; height: 180px; position: relative; z-index: 1; }
.call-ring { position: absolute; inset: 0; border-radius: 50%; background: rgb(255 255 255 / .55); }
.call-screen.listening .call-ring { animation: ring 1s ease-out infinite; background: rgb(17 112 79 / .25); }
.call-screen.talking .call-ring { animation: ring 1.4s ease-out infinite; background: rgb(31 111 131 / .2); }

  { id: 'ko-u8', s: 1, title: 'Greetings & manners', icon: '안녕',
    guide: [
      { h: 'Polite by default', p: 'Korean changes its endings with politeness. Use the polite 요-style (고마워요) with anyone you don’t know well, and the formal 합니다-style (감사합니다) for thanks and apologies to strangers, staff and elders. Casual speech is for close friends only.', ex: [['감사합니다', 'gamsahamnida', 'thank you (formal)'], ['고마워요', 'gomawoyo', 'thank you (polite)']] },
      { h: 'One hello for all day', p: '안녕하세요 means "are you at peace?" and works morning, noon and night.', ex: [['안녕하세요', 'annyeonghaseyo', 'hello']] },
      { h: 'Two goodbyes', p: 'Goodbye depends on who is leaving. To someone who is leaving: 안녕히 가세요 ("go in peace"). When YOU leave and they stay: 안녕히 계세요 ("stay in peace").', ex: [['안녕히 가세요', 'annyeonghi gaseyo', 'bye (you’re leaving)'], ['안녕히 계세요', 'annyeonghi gyeseyo', 'bye (I’m leaving)']] },

  { id: 'ko-u9', s: 1, title: 'Introducing yourself', icon: '저',
    guide: [
      { h: 'The verb goes last', p: 'Korean word order is Subject–Object–Verb. "I am a student" becomes "I (topic) student am": 저는 학생이에요.', ex: [['저는 학생이에요.', 'jeoneun haksaengieyo.', 'I am a student.']] },
      { h: 'Topic marker 은/는', p: '는/은 marks what you’re talking about ("as for me…"). Use 는 after a vowel and 은 after a consonant (batchim).', ex: [['저는', 'jeoneun', 'as for me (저 ends in a vowel)'], ['선생님은', 'seonsaengnimeun', 'as for the teacher (ends in ㅁ)']] },
      { h: '"Am / is / are": 이에요 / 예요', p: 'Attach it to a noun. 이에요 after a consonant, 예요 after a vowel. The same form works for questions: just raise your voice at the end.', ex: [['학생이에요', 'haksaengieyo', 'am a student'], ['의사예요', 'uisayeyo', 'am a doctor'], ['뭐예요?', 'mwoyeyo?', 'what is it?']] },

/* =====================================================================
   DARI — LONGER CHAT SCENES
   Compact format: st([t, rom, en], okRegex[], okRomRegex[], chips[[t, rom, en]], words[[t, rom, en]])
   The first chip is the model answer shown after a mistake.
   ok / okRom regexes are tested on the learner's reply with spaces and
   punctuation removed ({name} is replaced with the learner's name).
   ===================================================================== */
const _tre = a => ({ t: a[0], r: a[1], en: a[2] });
function st(say, ok, okRom, chips, words = []) {
  return { say: _tre(say), ok, okRom, model: _tre(chips[0]), chips: chips.map(_tre), words: words.map(_tre) };
}
function scene(id, title, en, level, steps, outro) { return { id, title, en, level, steps, outro: _tre(outro) }; }

function LS(p = P(), code = p.lang) {

/* Look-up tables for vocabulary items */
const VOCAB_INDEX = {};

function learnedWords(p, code) {

  const out = new Map();
  for (const [id, e] of Object.entries(l.srs || {})) { const v = VOCAB_INDEX[id]; if (v) out.set(v.t, { t: v.t, r: v.r, en: v.en, box: e.box, src: 'lesson', id }); }
  for (const w of Object.values(l.words || {})) if (!out.has(w.t)) out.set(w.t, { ...w, box: w.box || 1, src: 'chat' });
  return [...out.values()];
}
const wordsLearned = p => Object.keys(COURSES).reduce((n, c) => n + learnedWords(p, c).length, 0);
const UNIT_LESSONS = 5;
function unitProgress(p, code, id) { return p.langs[code]?.path?.[id] || 0; }

/* ---------- Hangeul composition (for the syllable builder) ---------- */
const HG = {
  I: ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'],

  F: ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'],
  RI: ['g', 'kk', 'n', 'd', 'tt', 'r', 'm', 'b', 'pp', 's', 'ss', '', 'j', 'jj', 'ch', 'k', 't', 'p', 'h'],
  RM: ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'],
  RF: ['', 'k', 'k', 'k', 'n', 'n', 'n', 't', 'l', 'k', 'm', 'l', 'l', 'l', 'p', 'l', 'm', 'p', 'p', 't', 't', 'ng', 't', 't', 'k', 't', 'p', 't'],
  compose(i, m, f = '') { const a = this.I.indexOf(i), b = this.M.indexOf(m), c = this.F.indexOf(f); return a < 0 || b < 0 || c < 0 ? '' : String.fromCharCode(0xAC00 + (a * 21 + b) * 28 + c); },
  rom(i, m, f = '') { return this.RI[this.I.indexOf(i)] + this.RM[this.M.indexOf(m)] + this.RF[this.F.indexOf(f)]; }
};

/* ---------- English answer normalisation (sentence builder) ---------- */
function normEn(s) {
  return ' ' + String(s).toLowerCase().replace(/[’‘]/g, "'")
    .replace(/(\d),(\d)/g, '$1$2')
    .replace(/\bit's\b/g, 'it is').replace(/\bi'm\b/g, 'i am').replace(/\bdon't\b/g, 'do not').replace(/\bisn't\b/g, 'is not')
    .replace(/\bthat's\b/g, 'that is').replace(/\bwhat's\b/g, 'what is').replace(/\bi'll\b/g, 'i will').replace(/\byou're\b/g, 'you are')
    .replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
}

/* ---------- 5. Spaced repetition (Leitner boxes 1–5) ---------- */
const SRS_DAYS = [0, 1, 2, 4, 8, 16];
const SRS = {
  update(id, ok) {
    const l = LS(); const e = l.srs[id] || { box: 0, right: 0, wrong: 0 };
    if (ok) { e.box = Math.min(5, e.box + 1); e.right++; e.due = Date.now() + SRS_DAYS[e.box] * DAY; }
    else { e.box = 1; e.wrong++; e.due = Date.now() + 10 * 60 * 1000; }
    l.srs[id] = e;
  },
  due(p = P(), code = p.lang) { const l = LS(p, code), now = Date.now(); return Object.entries(l.srs).filter(([, e]) => e.due <= now).map(([id]) => id); },
  weak(p = P(), code = p.lang) { return Object.entries(LS(p, code).srs).sort((a, b) => a[1].box - b[1].box || b[1].wrong - a[1].wrong).map(([id]) => id); },
  nextDue(p = P(), code = p.lang) { const ds = Object.values(LS(p, code).srs).map(e => e.due).filter(Boolean); return ds.length ? Math.min(...ds) : null; }

/* ---------- 6. XP, levels, streaks (with freezes), hearts, gems, quests ---------- */
const levelFor = xp => { let l = 1; while (xp >= 50 * l * (l + 1)) l++; return l; };
const levelBounds = l => [50 * (l - 1) * l, 50 * l * (l + 1)];

/** On open: if days were missed, spend streak freezes to cover them (Duolingo-style). */
function applyFreezes(p = P()) {
  if (!p.lastDay || p.lastDay === dayKey() || p.lastDay === yesterdayKey()) return;
  const missed = daysBetween(p.lastDay, dayKey()) - 1;
  if (missed > 0 && p.freezes >= missed) {
    p.freezes -= missed; p.lastDay = yesterdayKey(); Store.save();
    setTimeout(() => toast(`Streak saved! ${missed} streak freeze${missed > 1 ? 's' : ''} used.`, 'Fz'), 800);
  }

const HEART_MS = 30 * 60 * 1000, MAX_HEARTS = 5;
const Hearts = {
  sync(p = P()) {
    if (p.hearts >= MAX_HEARTS) { p.heartAt = Date.now(); return p.hearts; }
    const gained = Math.floor((Date.now() - p.heartAt) / HEART_MS);
    if (gained > 0) { p.hearts = Math.min(MAX_HEARTS, p.hearts + gained); p.heartAt += gained * HEART_MS; }
    return p.hearts;
  },
  left(p = P()) { return p.unlimitedHearts ? Infinity : this.sync(p); },
  lose(p = P()) { if (p.unlimitedHearts) return; this.sync(p); if (p.hearts === MAX_HEARTS) p.heartAt = Date.now(); p.hearts = Math.max(0, p.hearts - 1); Store.save(); },
  gain(n = 1, p = P()) { this.sync(p); p.hearts = Math.min(MAX_HEARTS, p.hearts + n); Store.save(); },
  nextIn(p = P()) { return Math.max(0, HEART_MS - (Date.now() - p.heartAt)); }
};

  p.xp += n; LS().xp += n; p.today.xp += n;
  const level = levelFor(p.xp);
  Store.save();
  Quests.bump('xp', n);
  const events = { streakUp, leveled: level > before, level, goal: !goalBefore && p.today.xp >= p.dailyGoal };
  celebrate(events);
  return events;
}
/** Mascot + toasts for streak / level / goal moments */
function celebrate(ev) {
  const p = P();
  if (ev.leveled) { Mascot.set('cheer', `LEVEL ${ev.level}! I’m telling everyone.`); toast(`Level ${ev.level} reached`, 'Lv'); Sfx.level(); confetti(); }
  else if (ev.streakUp && p.streak > 1) { Mascot.set('cheer', `${p.streak}-day streak! Look at you go.`); toast(`${p.streak}-day streak`, String(p.streak)); }
  else if (ev.goal) { Mascot.set('cheer', 'Daily goal smashed!'); toast('Daily goal complete', 'XP'); }
  renderChrome();
}
function checkAchievements() {
  const p = P();
  for (const a of ACHIEVEMENTS) if (!p.achievements[a.id] && a.test(p)) {
    p.achievements[a.id] = Date.now(); toast(`Achievement: ${a.name}`, a.g);
  }

}
function addJoke(text) {
  const p = P(); if (!text) return;
  if (!p.jokes.some(j => j.text === text)) { p.jokes.unshift({ text: String(text).slice(0, 300), at: Date.now(), m: p.mascot }); p.jokes = p.jokes.slice(0, 120); }
}

/* ---------- 7. Sound effects (Web Audio, no files) ---------- */
const Sfx = {
  ctx: null,
  tone(f, t0, dur, type = 'sine', g = .14) {
    if (!P()?.sound) return;
    try {
      this.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, o = c.createOscillator(), v = c.createGain(), t = c.currentTime + t0;
      o.type = type; o.frequency.setValueAtTime(f, t);
      v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + .01); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(v).connect(c.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) { /* audio unavailable */ }
  },
  tap() { this.tone(880, 0, .05, 'sine', .05); },
  correct() { this.tone(659, 0, .12, 'triangle'); this.tone(988, .09, .2, 'triangle'); },
  wrong() { this.tone(240, 0, .16, 'square', .05); this.tone(190, .12, .22, 'square', .05); },
  complete() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .28, 'triangle')); },
  level() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .08, .3, 'triangle', .12)); },
  pop() { this.tone(520, 0, .07, 'sine', .08); this.tone(780, .05, .08, 'sine', .06); }
};

/* ---------- 8. Speech: text-to-speech (native device voices) ---------- */
const Voice = {
  voices: [], warned: {},
  init() {
    if (!('speechSynthesis' in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  find(lang) { const base = lang.split('-')[0]; return this.voices.find(v => v.lang === lang) || this.voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base)); },
  speak(text, lang = course().tts, rate = .9, who = null) {
    if (!('speechSynthesis' in window)) { this.warn(lang, 'This browser has no speech voices.'); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = lang; const vp = VOICES[who] || null; u.rate = vp ? rate * vp[1] : rate; if (vp) u.pitch = vp[0];
      const v = this.find(lang); if (v) u.voice = v; else this.warn(lang, `No ${({ ko: 'Korean', ar: 'Arabic', es: 'Spanish' })[lang.slice(0, 2)] || lang} voice on this device. Install one in your system's language settings for native audio.`);
      this.last = u; speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  },
  /** Speak, then resolve when the line has finished (or after a safety timeout). */
  speakThen(text, lang, rate = .9, who = null) {
    return new Promise(res => {
      if (!('speechSynthesis' in window)) return res();
      const done = () => { clearTimeout(t); res(); }; const t = setTimeout(done, 1200 + String(text).length * 260);
      this.speak(text, lang, rate, who); try { const u = this.last; if (u) u.onend = done; } catch (e) { /* ignore */ }
    });
  },
  warn(lang, msg) { if (this.voices.length && !this.warned[lang]) { this.warned[lang] = 1; toast(msg); } }
};

/* ---------- 9. Speech: recognition (Web Speech API) ---------- */
const Mic = {
  SR: window.SpeechRecognition || window.webkitSpeechRecognition,
  blocked: false, active: null,
  supported() { return !!this.SR && !this.blocked; },
  /** Resolves with an array of transcript alternatives; rejects with an error code string. */
  listen(lang) {
    return new Promise((resolve, reject) => {
      if (!this.SR) return reject('unsupported');
      let done = false; const r = new this.SR();
      r.lang = lang; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
      r.onresult = e => { done = true; resolve([...e.results[0]].map(a => a.transcript)); };
      r.onerror = e => { done = true; if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') this.blocked = true; reject(e.error || 'error'); };
      r.onend = () => { if (!done) reject('no-speech'); this.active = null; };
      try { r.start(); this.active = r; } catch (err) { reject('start-failed'); }
    });
  },
  stop() { try { this.active && this.active.stop(); } catch (e) { /* ignore */ } },
  /** Ask for microphone permission once, up front, so voice answers start instantly later. */
  async prepare() {
    if (!navigator.mediaDevices?.getUserMedia) return !!this.SR;
    try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); st.getTracks().forEach(t => t.stop()); P().micReady = true; Store.save(); return true; }
    catch (e) { this.blocked = true; return false; }
  },
  explain(code) {
    return ({
      'not-allowed': 'Microphone access is blocked here. Use the standalone app file for voice, or type instead.',
      'service-not-allowed': 'Voice input is blocked in this view. Use the standalone app file for voice, or type instead.',
      'audio-capture': 'No microphone found.',
      'no-speech': 'I didn’t hear anything. Tap the mic and speak right away.',
      'network': 'Speech recognition needs an internet connection.',
      'unsupported': 'This browser has no speech recognition. Try Chrome or Edge, or type instead.'
    })[code] || 'Voice input didn’t work. Try again or type instead.';
  }
};

/* ---------- 11. The AI tutor ----------

     claude  — the page's built-in "ask Claude" capability (claude.ai only)

/** Fill {name} in a scripted line. */
const fillSay = s => ({ t: fill(s.t, { name: P().name }), r: fill(s.r, { name: P().name }), en: fill(s.en, { name: P().name }) });
const Tutor = {

  pickBrain() {

  label() { return { claude: 'Claude', gemini: 'Gemini', offline: 'Offline scenes' }[this.brain]; },

  },
  topic(id = LS().chat.topic) { return this.topics().find(t => t.id === id); },

  /** Begin a scene: the opener comes from the script so it is instant (no AI call). */
  start(id) {

    chat.topic = id; chat.step = 0; chat.done = false; chat.turns = [];
    if (t.game) { Buddy.start(); return; }

        ? { t: '안녕하세요! 오늘 기분이 어때요?', r: 'annyeonghaseyo! oneul gibuni eottaeyo?', en: 'Hi! How are you feeling today?' }
        : P().lang === 'es' ? { t: '¡Hola! ¿Qué tal tu día?', r: 'OH-lah! keh TAHL too DEE-ah?', en: 'Hi! How was your day?' }
        : { t: 'أهلا! كيف كان يومك؟', r: 'ahlan! kayfa kāna yawmuk?', en: 'Hi! How was your day?' };
      if (this.brain === 'offline') {
